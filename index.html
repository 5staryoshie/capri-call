<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri">
<meta name="theme-color" content="#d6564c">
<title>Capri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#e85c50; --coral-dim:#963430; --status:#d6564c; --status-ink:#280c0c; --title:#4a1416;
    --body-top:#2c0e12; --body-bot:#10090c; --bar:#762626; --field:#963632;
    --cyan:#5ee2ec; --cyan-ink:#96f0f6; --amber:#ecac3a; --amber-ink:#f8c860; --ink:#f6e2dc; --dim:#b07c74; --red:#ff3b4e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--body-bot);color:var(--ink);overflow:hidden;
    font:500 16px/1.3 "Barlow Semi Condensed","Bahnschrift","Arial Narrow",-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
  .phone{position:fixed;inset:0;display:flex;flex-direction:column;
    background:linear-gradient(var(--body-top),var(--body-bot))}
  /* faint vertical grid + scanlines over the body, like the messenger template */
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(90deg,rgba(255,120,110,.04) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  .phone > *{position:relative;z-index:1}

  /* ---- coral status bar */
  .status{background:var(--status);color:var(--status-ink);padding:calc(env(safe-area-inset-top) + 4px) 14px 4px;
    display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.6px}
  .wave{display:flex;align-items:center;gap:2px;height:14px}
  .wave i{display:block;width:2px;background:var(--status-ink);border-radius:1px;height:4px;transition:height .08s linear}
  .status .label{flex:1}
  .status .clock{font-variant-numeric:tabular-nums}
  .batt{width:20px;height:10px;border:1.4px solid var(--status-ink);position:relative;margin-left:2px}
  .batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--status-ink)}
  .batt b{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:75%;background:var(--status-ink)}

  /* ---- title bar */
  .titlebar{background:var(--title);border-bottom:1.5px solid var(--coral);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .sq{width:30px;height:30px;border:1.6px solid var(--coral);background:transparent;display:grid;place-items:center;padding:0;color:var(--coral)}
  .sq:active{background:rgba(232,92,80,.25)}
  .sq svg{width:16px;height:16px}
  .title{font-weight:700;font-size:25px;color:var(--cyan);letter-spacing:.5px;text-shadow:0 0 12px rgba(94,226,236,.45)}

  /* ---- stage: her face */
  .stage{display:flex;flex-direction:column;align-items:center;padding:18px 16px 8px}
  .frame{position:relative;width:min(46vw,190px);aspect-ratio:1;
    --cut:16px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    background:var(--coral);padding:2px;transition:background .3s}
  .frame-wrap{position:relative;filter:drop-shadow(0 0 10px rgba(232,92,80,.45));transition:filter .3s}
  .frame-wrap.listen{filter:drop-shadow(0 0 12px rgba(94,226,236,.55))}
  .frame-wrap.listen .frame{background:var(--cyan)}
  .frame-wrap.speak .frame{background:var(--amber)}
  .frame-wrap.speak{animation:talk .5s ease-in-out infinite alternate}
  @keyframes talk{from{filter:drop-shadow(0 0 6px rgba(236,172,58,.35))}to{filter:drop-shadow(0 0 18px rgba(236,172,58,.75))}}
  .frame-in{position:relative;width:100%;height:100%;overflow:hidden;
    clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px));background:#1a0a0d}
  .frame-in img{width:100%;height:100%;object-fit:cover;display:block}
  .frame-in .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);font-weight:700;font-size:64px;letter-spacing:-2px}
  .frame-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  .glitch .frame-in img{animation:glitch .28s steps(2) 1}
  @keyframes glitch{
    0%{transform:translate(3px,-2px);filter:hue-rotate(40deg) saturate(1.6);clip-path:inset(10% 0 55% 0)}
    25%{transform:translate(-4px,1px);clip-path:inset(60% 0 8% 0)}
    50%{transform:translate(2px,2px);filter:hue-rotate(-30deg);clip-path:inset(30% 0 35% 0)}
    100%{transform:none;filter:none;clip-path:inset(0)}}
  .ticks{position:absolute;inset:-9px;pointer-events:none}
  .ticks i{position:absolute;width:14px;height:14px;border-color:var(--cyan);border-style:solid;opacity:.7}
  .ticks i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}.ticks i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}
  .ticks i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}.ticks i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}

  .state{margin-top:14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:2px;color:var(--dim);
    border:1.3px solid currentColor;padding:4px 12px 4px 10px;min-height:28px}
  .state .dot{width:8px;height:8px;background:currentColor;border-radius:50%}
  .state.live{color:var(--cyan)} .state.busy{color:var(--amber)} .state.warn{color:#ffb35c} .state.off{color:var(--coral)}
  .state.live .dot,.state.busy .dot{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .viz{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:22px;margin-top:10px}
  .viz i{width:4px;height:3px;background:var(--coral-dim);transition:height .07s linear,background .2s}

  /* ---- conversation: messenger boxes */
  .log{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 10px;-webkit-overflow-scrolling:touch;
    -webkit-user-select:text;user-select:text;mask-image:linear-gradient(transparent 0,#000 18px)}
  .log.hide{visibility:hidden}
  .msg{display:flex;flex-direction:column;margin:10px 0;max-width:84%;animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .who{font-size:12px;letter-spacing:.6px;margin:0 0 3px 1px;font-weight:600}
  .msg .box{border:1.3px solid;padding:6px 10px 7px;font-size:16.5px;line-height:1.3;word-wrap:break-word}
  .msg.her{align-self:flex-start}
  .msg.her .who{color:var(--amber)} .msg.her .box{border-color:var(--amber);background:rgba(236,172,58,.22);color:var(--amber-ink)}
  .msg.you{align-self:flex-end;align-items:flex-end;margin-left:auto}
  .msg.you .who{color:var(--cyan)} .msg.you .box{border-color:var(--cyan);background:rgba(94,226,236,.18);color:var(--cyan-ink)}
  .msg.you.pending .box{opacity:.75}
  .msg.cut .box::after{content:" —";opacity:.6}
  .hint{margin:18px auto 0;max-width:290px;text-align:center;color:var(--dim);font-size:14px;line-height:1.45;border-top:1px solid rgba(232,92,80,.3);padding-top:12px}
  .hint b{color:var(--cyan);font-weight:600}
  .typing{display:flex;align-items:center;gap:7px;color:var(--amber);font-size:13px;letter-spacing:.5px;margin:6px 0 2px;font-weight:600}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:bounce 1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,100%{opacity:.35;transform:none}40%{opacity:1;transform:translateY(-3px)}}
  .dots::after{content:"";animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* ---- type bar */
  .typebar{display:none;gap:8px;padding:8px 12px;background:var(--bar);border-top:1.5px solid var(--coral)}
  .typebar.show{display:flex}
  .typebar input{flex:1;min-width:0;background:var(--field);border:1.3px solid var(--coral);color:#ffe4dc;padding:9px 10px;font:inherit;font-size:16px;outline:none;border-radius:0}
  .typebar input::placeholder{color:#e8b0a8}
  .typebar button{background:var(--coral);border:0;color:var(--bar);padding:0 12px;display:grid;place-items:center}
  .typebar button svg{width:22px;height:22px}

  /* ---- bottom bar: call controls */
  .bottombar{background:var(--bar);border-top:1.5px solid var(--coral);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ctl{width:52px;height:52px;border:1.6px solid var(--coral);background:rgba(232,92,80,.12);color:var(--coral);display:grid;place-items:center;padding:0;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .08s,background .15s}
  .ctl:active{transform:scale(.92)}
  .ctl svg{width:24px;height:24px}
  .ctl.on{background:var(--coral);color:var(--bar)}
  .big{flex:1;max-width:170px;height:56px;border:0;font:inherit;font-weight:700;font-size:20px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:8px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:transform .08s,filter .2s}
  .big:active{transform:scale(.95)}
  .big svg{width:24px;height:24px}
  .big.call{background:var(--cyan);color:#06181b;filter:drop-shadow(0 0 10px rgba(94,226,236,.6))}
  .big.end{background:var(--red);color:#fff;filter:drop-shadow(0 0 10px rgba(255,59,78,.55))}
  .bottombar .ctl.hidden{visibility:hidden}

  /* ---- menu */
  .menu{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:5;background:var(--title);border:1.5px solid var(--coral);min-width:230px;display:none;
    box-shadow:0 0 22px rgba(232,92,80,.35)}
  .menu.show{display:block;animation:pop .15s ease-out}
  .menu button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid rgba(232,92,80,.3);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;text-align:left}
  .menu button:last-child{border-bottom:0}
  .menu .tg{width:38px;height:20px;border:1.4px solid var(--coral);position:relative;flex:none;margin-left:14px}
  .menu .tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:13px;background:var(--coral);transition:left .15s,background .15s}
  .menu .tg.on{border-color:var(--cyan);background:rgba(94,226,236,.25)}
  .menu .tg.on::after{left:19px;background:var(--cyan)}

  .setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--body-bot);z-index:9}
  .setup.show{display:flex}
  .setup div{max-width:340px;color:var(--dim);border:1.5px solid var(--coral);padding:20px;background:var(--title)}
  .setup b{color:var(--cyan);display:block;font-size:22px;margin-bottom:8px}

  /* ================= the phone app: tabs, Home, Life, Gym (Night City planner style) ================= */
  :root{ --yel:#fcec0c; --yel-dim:#bea81e; --lred:#ec2e3a; --pink:#ec3668; --panel:rgba(28,12,20,.92); --dark:#1a0a0c; }
  .views{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column}
  .view.on{display:flex}
  .bottombar{padding-bottom:12px}
  .tabbar{display:flex;background:#1c0a0e;border-top:1.5px solid var(--lred);padding:4px 6px calc(env(safe-area-inset-bottom) + 4px);position:relative;z-index:2}
  .tabbar button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--yel)}
  .tabbar button.on::before{content:"";position:absolute;top:-5px;left:28%;right:28%;height:3px;background:var(--yel);box-shadow:0 0 10px var(--yel)}
  .tabbar .live{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);display:none}
  .tabbar .live.on{display:block}

  .lp{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 30px;position:relative;-webkit-user-select:none}
  .lp::before{content:"";position:absolute;left:-30%;right:-30%;top:-120px;height:420px;pointer-events:none;
    background:radial-gradient(ellipse at 55% 30%,rgba(236,54,104,.42),rgba(236,46,58,0) 70%)}
  .lp > *{position:relative}
  .mono{font-family:"Share Tech Mono","Consolas",monospace;letter-spacing:.5px}
  .ltitle{font-family:"Chakra Petch","Barlow Semi Condensed",sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--yel);letter-spacing:.5px;text-shadow:0 0 18px rgba(252,236,12,.25)}
  .lsub{font-family:"Share Tech Mono",monospace;color:var(--lred);font-size:12px;letter-spacing:1px;margin-top:6px}
  .sync{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:6px}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
  .sync.ok i{background:var(--cyan);box-shadow:0 0 6px var(--cyan)} .sync.off i{background:var(--lred)}

  .strip{display:flex;flex-wrap:wrap;gap:4px 18px;margin:14px 0 4px;align-items:baseline;border-bottom:1px solid rgba(236,46,58,.55);padding-bottom:10px}
  .strip b{font-family:"Share Tech Mono",monospace;font-weight:400;font-size:26px;color:var(--yel)}
  .strip b.c{color:var(--cyan-ink)} .strip span{font-size:10px;color:var(--dim);letter-spacing:1px;margin-left:4px}

  .head{display:flex;align-items:center;margin:20px 0 10px;gap:0}
  .head .tab{background:var(--yel);color:var(--dark);font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;padding:3px 26px 3px 10px;
    clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);white-space:nowrap}
  .head .rule{flex:1;height:1px;background:rgba(252,236,12,.55);align-self:flex-end;margin-left:-6px}
  .head .r{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--yel);margin-left:8px;white-space:nowrap}

  .cut{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .panel{background:var(--panel);border:1.2px solid rgba(236,46,58,.6);padding:12px;position:relative}
  .panel.y{border-color:var(--yel);box-shadow:0 0 14px rgba(252,236,12,.18)}
  .panel.c{border-color:var(--cyan);box-shadow:0 0 14px rgba(94,226,236,.18)}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .card{background:var(--panel);border:1.3px solid rgba(236,46,58,.7);text-align:center;padding:0 0 12px;position:relative}
  .card .hb{background:var(--lred);color:#3c080e;font-size:10px;font-weight:700;letter-spacing:1.5px;padding:3px 0;margin:2px 2px 0}
  .card.sel{border-color:var(--yel);box-shadow:0 0 16px rgba(252,236,12,.25)} .card.sel .hb{background:#fff6d2;color:var(--dark)}
  .card svg{width:38px;height:38px;margin:12px auto 6px;display:block;color:var(--lred)} .card.sel svg{color:var(--yel)}
  .card .v{font-family:"Share Tech Mono",monospace;font-size:20px;color:var(--ink)} .card.sel .v{color:var(--yel)}
  .card .s{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}

  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;margin-top:14px;height:54px;font:inherit;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:19px;letter-spacing:2px;
    background:var(--yel);color:var(--dark);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);filter:drop-shadow(0 0 10px rgba(252,236,12,.45))}
  .bigbtn svg{width:24px;height:24px}
  .bigbtn.red{background:var(--lred);color:#fff;filter:drop-shadow(0 0 10px rgba(236,46,58,.5))}
  .bigbtn.ghost{background:rgba(236,46,58,.12);color:var(--ink);border:1.4px solid var(--lred);filter:none}
  .bigbtn:active{transform:scale(.97)}

  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:rgba(36,12,18,.9);border:1.3px solid rgba(236,46,58,.7);color:var(--ink);font:inherit;font-family:"Share Tech Mono",monospace;font-size:13px;padding:7px 12px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);white-space:nowrap}
  .chip.on{background:var(--yel);color:var(--dark);border-color:var(--yel)}
  .chip.cy{border-color:var(--cyan);color:var(--cyan-ink)}
  .chip:active{transform:scale(.95)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .stats.four{grid-template-columns:repeat(2,1fr)}
  .stat{background:rgba(70,12,26,.85);border:1px solid rgba(236,46,58,.6);padding:6px 8px}
  .stat small{display:block;font-size:9.5px;color:rgba(246,226,220,.65);letter-spacing:1px}
  .stat b{font-family:"Share Tech Mono",monospace;font-weight:400;font-size:17px;color:var(--ink)}
  .stat b.y{color:var(--yel)} .stat b.c{color:var(--cyan-ink)} .stat b.r{color:var(--lred)}

  .seg{height:10px;display:flex;gap:2px;margin:6px 0}
  .seg i{flex:1;background:rgba(252,236,12,.12);border:1px solid rgba(252,236,12,.15)}
  .seg i.on{background:var(--yel);border-color:var(--yel)}
  .seg.c i{background:rgba(94,226,236,.1);border-color:rgba(94,226,236,.14)} .seg.c i.on{background:var(--cyan);border-color:var(--cyan)}
  .seg.r i.on{background:var(--lred);border-color:var(--lred)}
  .seg.tall{height:18px}

  .row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid rgba(236,46,58,.18)}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t small{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--dim)}
  .row .a{font-family:"Share Tech Mono",monospace;font-size:15px}
  .x{background:none;border:0;color:var(--dim);font-size:20px;padding:0 4px;font-family:inherit}
  .x.arm{color:var(--lred)}
  .neg{color:var(--coral)} .pos{color:var(--cyan-ink)} .yel{color:var(--yel)} .dim{color:var(--dim)}
  .hint2{color:var(--dim);font-size:13px;padding:4px 2px}

  .form{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .form input{flex:1;min-width:0;background:#2c1018;border:1.3px solid rgba(236,46,58,.6);color:#ffe4dc;font:inherit;font-size:16px;padding:10px;border-radius:0;outline:none;-webkit-user-select:text;user-select:text}
  .form input:focus{border-color:var(--yel)}
  .form input.w2{flex:0 0 92px}
  .form textarea{flex:1;min-width:0;background:#2c1018;border:1.3px solid rgba(94,226,236,.55);color:#ffe4dc;font:inherit;font-size:16px;padding:10px;border-radius:0;outline:none;resize:vertical;min-height:96px;-webkit-user-select:text;user-select:text}
  .form textarea:focus{border-color:var(--cyan)}
  .ranks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .rk{display:flex;justify-content:space-between;gap:4px;font-size:9.5px;letter-spacing:.5px;color:var(--yel);white-space:nowrap}
  .rk.c{color:var(--cyan-ink)} .rk span:last-child{color:var(--dim);font-family:"Share Tech Mono",monospace}
  .wbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wbig b{font-family:"Share Tech Mono",monospace;font-weight:400;font-size:44px;color:var(--yel);line-height:1}

<script>
(() => {
  const NTFY = 'https://ntfy.sh/';
  const MARK = 'CAPRICALL1 ';
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // private channel names travel in the link's #hash (never sent to this site); remember them for the home-screen app
  function readCfg() {
    const h = new URLSearchParams(location.hash.slice(1));
    let o = h.get('o'), i = h.get('i');
    if (o && i) store.set('capri-call', {o, i});
    else { const c = store.get('capri-call', null); if (c) { o = c.o; i = c.i; } }
    const ok = s => /^[-_A-Za-z0-9]{8,64}$/.test(s || '');
    return ok(o) && ok(i) ? {out: o, inn: i, call: o + '-call'} : null;
  }
  const cfg = readCfg();
  if (!cfg) { $('setup').classList.add('show'); return; }

  // ---------------------------------------------------------- her faces (sent once by the laptop, kept on the phone)
  const ALIAS = {};
  let faces = store.get('capri-faces', {fv: '', imgs: {}});
  // her little "thinking" sounds (made once on the laptop, kept here)
  let fillers = store.get('capri-fillers', {v: '', clips: {}});
  let audioQ = [], moreTurn = null, moreTimer = null, waitingMore = false;
  let fillerTimer = null, fillerPlaying = false, pendingGo = null, lastFiller = '';
  async function gotFiller(j, url) {
    if (!url || !j.name) return;
    try {
      const b = await (await fetch(url)).blob();
      const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
      if (fillers.v !== j.flv) fillers = {v: j.flv || '', clips: {}};
      fillers.clips[j.name] = data;
      store.set('capri-fillers', fillers);
    } catch (e) {}
  }
  let curMood = 'calm';
  function setFace(m, glitch) {
    m = m || 'calm';
    const src = faces.imgs[m] || faces.imgs[ALIAS[m]] || faces.imgs.calm;
    if (!src) return;
    const img = $('face');
    if (img.src !== src) {
      img.src = src; img.style.display = 'block'; $('ph').style.display = 'none';
      if (glitch && m !== curMood) { const w = $('frameWrap'); w.classList.remove('glitch'); void w.offsetWidth; w.classList.add('glitch'); }
    }
    curMood = m;
  }
  setFace('calm');
  async function gotFace(j, url) {
    if (!url || !j.name) return;
    try {
      const b = await (await fetch(url)).blob();
      const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
      faces.imgs[j.name] = data; faces.fv = j.fv || faces.fv;
      store.set('capri-faces', faces);
      if (j.name === curMood || (j.name === 'calm' && !$('face').src)) setFace(curMood);
    } catch (e) { faces.imgs[j.name] = url; if (j.name === 'calm') setFace('calm'); }
  }

  // ---------------------------------------------------------- settings
  let barge = store.get('capri-barge', true), captions = store.get('capri-caps', true);
  function paintSettings() {
    $('tgBarge').classList.toggle('on', barge); $('spkBtn').classList.toggle('on', barge);
    $('tgCaps').classList.toggle('on', captions); $('ccBtn').classList.toggle('on', captions);
    $('log').classList.toggle('hide', !captions);
  }
  paintSettings();

  // ---------------------------------------------------------- the screen
  const statusEl = $('state'), wrap = $('frameWrap'), log = $('log');
  const VIZ = 22; for (let k = 0; k < VIZ; k++) $('viz').appendChild(document.createElement('i'));
  const vizBars = [...$('viz').children], waveBars = [...$('wave').children];
  let state = 'idle';            // idle | connecting | listen | send | think | speak | muted
  function setStatus(t, cls) { $('stateText').textContent = t; statusEl.className = 'state ' + (cls || ''); }
  function setState(s) {
    state = s;
    clearTimeout(fillerTimer);
    if (s === 'think') fillerTimer = setTimeout(playFiller, 900);
    wrap.classList.toggle('listen', s === 'listen');
    wrap.classList.toggle('speak', s === 'speak');
    if (s === 'listen') setStatus('LISTENING', 'live');
    else if (s === 'send') setStatus('SENDING', 'busy');
    else if (s === 'think') setStatus('THINKING', 'busy');
    else if (s === 'speak') setStatus('SPEAKING', 'busy');
    else if (s === 'muted') setStatus('MUTED', 'off');
  }

  function scrollDown() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
  function addMsg(her, text, cls) {
    const h = log.querySelector('.hint'); if (h) h.remove();
    const m = document.createElement('div');
    m.className = 'msg ' + (her ? 'her' : 'you') + (cls ? ' ' + cls : '');
    m.innerHTML = '<div class="who"></div><div class="box"></div>';
    m.querySelector('.who').textContent = her ? 'Capri' : 'You';
    m.querySelector('.box').textContent = text;
    log.appendChild(m);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    scrollDown();
    return m;
  }
  log.innerHTML = '<div class="hint">Tap <b>CALL</b> and just talk. She hears when you stop.<br>Start talking while she speaks to <b>cut her off</b>.</div>';
  let typingEl = null;
  function showTyping(on) {
    if (on && !typingEl) { typingEl = document.createElement('div'); typingEl.className = 'typing'; typingEl.innerHTML = 'Capri is thinking <i></i><i></i><i></i>'; log.appendChild(typingEl); scrollDown(); }
    if (!on && typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ---------------------------------------------------------- talking to the laptop (ntfy)
  let session = '', turnN = 0, pendingTurn = null, turnTimer = null, laptopSeen = false, es = null, pendingYou = null, lastHer = null;
  function listenForHer() {
    if (es) es.close();
    es = new EventSource(NTFY + cfg.call + '/sse');
    es.onmessage = ev => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.event !== 'message') return;
      let j; try { j = JSON.parse(d.message || '{}'); } catch (e) { return; }
      if (!j.turn || !session || !String(j.turn).startsWith(session)) return;      // not for this call
      if (j.t === 'hi') {
        laptopSeen = true;
        if (j.fv && j.fv !== faces.fv) post(MARK + session + '-0 faces').catch(() => {});
        if (j.flv && j.flv !== fillers.v) setTimeout(() => post(MARK + session + '-0 fillers').catch(() => {}), 2500);
        if (state === 'connecting') { setStatus('CONNECTED', 'live'); setTimeout(startListening, 350); }
        return;
      }
      if (j.t === 'face') { gotFace(j, d.attachment && d.attachment.url); return; }
      if (j.t === 'filler') { gotFiller(j, d.attachment && d.attachment.url); return; }
      if (j.t === 'more' && j.turn === moreTurn) { gotMore(j, d.attachment && d.attachment.url); return; }
      if (j.t === 'heard' && j.turn === pendingTurn) { showHeard(j.heard); return; }
      if (j.t === 'reply' && j.turn === pendingTurn) onReply(j, d.attachment && d.attachment.url);
    };
    es.onerror = () => { if (state !== 'idle') setStatus('RECONNECTING', 'warn'); };
    es.onopen = () => { if (state === 'listen') setState('listen'); };
  }
  async function post(body, query) {
    const r = await fetch(NTFY + cfg.inn + (query ? '?' + query : ''), {method: 'POST', body});
    if (!r.ok) throw new Error('ntfy ' + r.status);
  }
  function newTurn() { turnN++; return session + '-' + turnN; }

  function showHeard(text) {
    text = (text || '').trim();
    if (pendingYou) {
      if (text) { pendingYou.querySelector('.box').textContent = text; pendingYou.classList.remove('pending'); }
      else pendingYou.remove();
      pendingYou = null;
    } else if (text) addMsg(false, text);
    showTyping(true);
    if (state === 'send') setState('think');
  }

  function waitForReply(turn) {
    pendingTurn = turn;
    clearTimeout(turnTimer);
    turnTimer = setTimeout(() => {
      if (pendingTurn !== turn) return;
      pendingTurn = null; showTyping(false);
      if (pendingYou) { pendingYou.remove(); pendingYou = null; }
      addMsg(true, laptopSeen ? "Hm, I didn't get that one. Say it again?" : "Your laptop isn't answering. Is Capri running and online?");
      setStatus('NO ANSWER', 'warn');
      setTimeout(resumeAfterTurn, 1800);
    }, 70000);
  }

  async function sendVoice(blob) {
    const turn = newTurn();
    setState('send');
    pendingYou = addMsg(false, '', 'pending');
    pendingYou.querySelector('.box').innerHTML = '<span class="dots">hearing you</span>';
    try {
      await post(new Blob([blob]), 'filename=voice.' + recExt + '&message=' + encodeURIComponent(MARK + turn));
      setState('think'); waitForReply(turn);
    } catch (e) {
      if (pendingYou) { pendingYou.remove(); pendingYou = null; }
      addMsg(true, "Couldn't send that. Check your signal.");
      setStatus('SEND FAILED', 'warn'); setTimeout(resumeAfterTurn, 1500);
    }
  }

  async function sendText(text) {
    const turn = newTurn();
    await stopRecorder(true);
    addMsg(false, text);
    setState('send'); showTyping(true);
    try { await post(MARK + turn + '\n' + text); setState('think'); waitForReply(turn); }
    catch (e) { showTyping(false); addMsg(true, "Couldn't send that. Check your signal."); setTimeout(resumeAfterTurn, 1500); }
  }

  function onReply(j, audioUrl) {
    clearTimeout(turnTimer);
    pendingTurn = null;
    if (pendingYou) showHeard(j.heard);
    showTyping(false);
    lastHer = addMsg(true, j.text || '');
    setFace(j.mood || 'calm', true);
    if (state === 'idle') return;
    audioQ = []; clearTimeout(moreTimer); waitingMore = false;
    moreTurn = j.more ? j.turn : null;               // the rest of what she says is on its way as a second clip
    setState('speak'); speakStart = performance.now(); bargeMs = 0;
    const go = () => {
      if (state !== 'speak') return;
      if (audioUrl) playClip(audioUrl, j.text);
      else { moreTurn = null; speakFallback(j.text); }
    };
    if (fillerPlaying) pendingGo = go; else go();
  }

  // ---- her reply can come in two clips: play them back to back
  function playClip(url, text) {
    player.src = url;
    player.onended = clipEnded;
    player.onerror = () => { moreTurn = null; audioQ = []; speakFallback(text); };
    const p = player.play();
    if (p && p.catch) p.catch(() => { moreTurn = null; audioQ = []; speakFallback(text); });
  }
  function clipEnded() {
    if (state !== 'speak') return;
    if (audioQ.length) { playClip(audioQ.shift(), ''); return; }
    if (moreTurn) {
      waitingMore = true;
      moreTimer = setTimeout(() => { waitingMore = false; moreTurn = null; if (state === 'speak') resumeAfterTurn(); }, 9000);
      return;
    }
    resumeAfterTurn();
  }
  function gotMore(j, url) {
    moreTurn = null;
    if (!url || j.fail) { if (waitingMore) { clearTimeout(moreTimer); waitingMore = false; if (state === 'speak') resumeAfterTurn(); } return; }
    if (waitingMore) { clearTimeout(moreTimer); waitingMore = false; if (state === 'speak') playClip(url, ''); }
    else audioQ.push(url);
  }
  function playFiller() {
    if (state !== 'think') return;
    const names = Object.keys(fillers.clips || {});
    if (!names.length) return;
    let pick = names[Math.floor(Math.random() * names.length)];
    if (pick === lastFiller && names.length > 1) pick = names[(names.indexOf(pick) + 1) % names.length];
    lastFiller = pick;
    fillerPlaying = true;
    const done = () => { fillerPlaying = false; const g = pendingGo; pendingGo = null; if (g) g(); };
    player.src = fillers.clips[pick];
    player.onended = done; player.onerror = done;
    const p = player.play(); if (p && p.catch) p.catch(done);
  }

  function speakFallback(text) {
    if (!('speechSynthesis' in window) || !text) { setTimeout(() => { if (state === 'speak') resumeAfterTurn(); }, 1200 + 45 * (text || '').length); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1.15;
    u.onend = () => { if (state === 'speak') resumeAfterTurn(); };
    u.onerror = () => { if (state === 'speak') resumeAfterTurn(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  function hush() {
    audioQ = []; moreTurn = null; clearTimeout(moreTimer); waitingMore = false; fillerPlaying = false; pendingGo = null; clearTimeout(fillerTimer);
    try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {}
  }

  function resumeAfterTurn() {
    if (state === 'idle') return;
    setFace(curMood);
    if (muted) setState('muted'); else startListening();
  }

  // ---------------------------------------------------------- the mic: hands-free, it hears when you start and stop talking
  let stream = null, ctx = null, analyser = null, buf = null, rec = null, chunks = [], recType = '', recExt = 'm4a';
  let speechMs = 0, silenceMs = 0, listenStart = 0, heardAny = false, floor = 0.01, lastTick = 0;
  let speakStart = 0, bargeMs = 0, echoFloor = 0.02, lastLv = 0;
  let muted = false, wakeLock = null, callStart = 0, clockIv = null, vadIv = null;
  const player = new Audio(); player.playsInline = true; player.preload = 'auto';

  function pickType() {
    const types = [['audio/mp4', 'm4a'], ['audio/mp4;codecs=mp4a.40.2', 'm4a'], ['audio/webm;codecs=opus', 'webm'], ['audio/webm', 'webm']];
    for (const [t, e] of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { recType = t; recExt = e; return; }
    recType = ''; recExt = 'm4a';
  }
  async function ensureMic() {
    if (stream && stream.getAudioTracks().some(t => t.readyState === 'live')) return;
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
  }
  function startRecorder() {
    chunks = [];
    try { rec = recType ? new MediaRecorder(stream, {mimeType: recType}) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    if (!recType && rec.mimeType) recExt = rec.mimeType.includes('webm') ? 'webm' : 'm4a';
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start();
  }
  function stopRecorder(discard) {
    return new Promise(res => {
      if (!rec || rec.state === 'inactive') { rec = null; return res(null); }
      const r = rec; rec = null;
      r.onstop = () => res(discard ? null : new Blob(chunks, {type: r.mimeType || recType || 'audio/mp4'}));
      try { r.stop(); } catch (e) { res(null); }
    });
  }
  async function startListening(alreadyTalking) {
    if (state === 'idle' || muted) return;
    try { await ensureMic(); }
    catch (e) { setStatus('MIC BLOCKED', 'warn'); addMsg(true, 'I can’t hear you: allow the microphone in Settings > Safari > Microphone.'); return; }
    if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    await stopRecorder(true);
    startRecorder();
    speechMs = alreadyTalking ? 300 : 0; silenceMs = 0; heardAny = !!alreadyTalking; listenStart = performance.now(); lastTick = listenStart;
    setState('listen');
  }
  function level() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k] * buf[k];
    return Math.sqrt(s / buf.length);
  }

  // talking over her: a strong, steady voice while she speaks cuts her off (her own echo is mostly cancelled by the phone)
  function bargeTick(lv, dt, now) {
    if (!barge || now - speakStart < 450) return;
    const thr = Math.max(0.05, echoFloor * 3.4);
    if (lv > thr) bargeMs += dt;
    else { bargeMs = Math.max(0, bargeMs - dt * 2); echoFloor = echoFloor * 0.96 + Math.min(lv, 0.08) * 0.04; }
    if (bargeMs > 240) {
      bargeMs = 0;
      hush();
      if (lastHer) lastHer.classList.add('cut');
      startListening(true);
    }
  }

  async function vadTick() {
    const now = performance.now(), dt = Math.min(200, now - lastTick); lastTick = now;
    const lv = (state === 'listen' || state === 'speak') ? level() : 0;
    lastLv = lv;
    if (state === 'speak') { bargeTick(lv, dt, now); return; }
    if (state !== 'listen' || !rec) return;
    if (!heardAny) floor = floor * 0.97 + Math.min(lv, 0.05) * 0.03;
    const thr = Math.max(0.018, floor * 2.6);
    if (lv > thr) { speechMs += dt; silenceMs = 0; if (speechMs > 180) heardAny = true; }
    else { silenceMs += dt; if (!heardAny) speechMs = Math.max(0, speechMs - dt); }
    const long = now - listenStart;
    if (heardAny && (silenceMs > 800 || long > 28000)) {
      const blob = await stopRecorder(false);
      if (blob && blob.size > 1500) sendVoice(blob); else startListening();
      return;
    }
    if (!heardAny && long > 20000) startListening();      // keep clips small while it's quiet
  }

  // meters: your voice (cyan) while listening, her talking (amber), idle (coral)
  function drawMeters(t) {
    const speaking = state === 'speak', listening = state === 'listen';
    for (let k = 0; k < VIZ; k++) {
      let h;
      if (listening) h = 3 + Math.min(19, lastLv * 260 * (0.6 + 0.4 * Math.sin(k * 1.7 + t / 90)));
      else if (speaking) h = 4 + 14 * Math.abs(Math.sin(t / 110 + k * 0.6)) * (0.5 + 0.5 * Math.sin(t / 370 + k));
      else if (state === 'think' || state === 'send') h = 3 + 6 * Math.max(0, Math.sin(t / 160 - k * 0.45));
      else h = 3;
      vizBars[k].style.height = h.toFixed(1) + 'px';
      vizBars[k].style.background = listening ? 'var(--cyan)' : speaking ? 'var(--amber)' : (state === 'think' || state === 'send') ? 'var(--amber)' : 'var(--coral-dim)';
    }
    for (let k = 0; k < waveBars.length; k++) {
      const a = state === 'idle' ? 0.35 : (speaking ? Math.abs(Math.sin(t / 120 + k)) : listening ? Math.min(1, lastLv * 30 + 0.15) * (0.6 + 0.4 * Math.sin(t / 80 + k)) : 0.4);
      waveBars[k].style.height = (3 + 10 * a).toFixed(1) + 'px';
    }
    requestAnimationFrame(drawMeters);
  }
  requestAnimationFrame(drawMeters);

  // ---------------------------------------------------------- call controls
  function unlockAudio() {
    // iOS only lets sound play after a tap: play a blip of silence now so her replies can play later
    const sr = 8000, n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    player.src = URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    const p = player.play(); if (p && p.catch) p.catch(() => {});
    if ('speechSynthesis' in window) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  }
  function showControls(inCall) {
    ['muteBtn', 'kbBtn', 'ccBtn', 'spkBtn'].forEach(id => $(id).classList.toggle('hidden', !inCall));
    const b = $('callBtn');
    b.className = 'big ' + (inCall ? 'end' : 'call');
    $('callLbl').textContent = inCall ? 'END' : 'CALL';
  }
  function tickClock() {
    if (state === 'idle') { $('clock').textContent = new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}); return; }
    const s = Math.floor((Date.now() - callStart) / 1000);
    $('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  tickClock(); clockIv = setInterval(tickClock, 500);

  async function startCall() {
    unlockAudio(); pickType();
    session = Math.random().toString(36).slice(2, 8); turnN = 0; laptopSeen = false;
    showControls(true); $('slabel').textContent = 'CAPRI // VOICE LINK  ·  LIVE';
    state = 'connecting'; setStatus('CALLING', 'busy');
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); await ensureMic(); }
    catch (e) { setStatus('MIC BLOCKED', 'warn'); }
    listenForHer();
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    callStart = Date.now();
    vadIv = setInterval(vadTick, 50);
    try { await post(MARK + session + '-0 hello'); } catch (e) {}
    setTimeout(() => {
      if (state !== 'connecting') return;
      setStatus('NO LAPTOP YET', 'warn');
      startListening();
    }, 6000);
  }

  async function endCall() {
    if (state !== 'idle') post(MARK + session + '-0 bye').catch(() => {});
    state = 'idle';
    clearInterval(vadIv); clearTimeout(turnTimer); pendingTurn = null; showTyping(false);
    if (pendingYou) { pendingYou.remove(); pendingYou = null; }
    await stopRecorder(true);
    hush();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; analyser = null; }
    if (es) { es.close(); es = null; }
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
    showControls(false); $('typebar').classList.remove('show'); $('kbBtn').classList.remove('on');
    wrap.className = 'frame-wrap'; $('slabel').textContent = 'CAPRI // VOICE LINK';
    setStatus('CALL ENDED', 'off'); setFace('calm');
    setTimeout(() => { if (state === 'idle') setStatus('TAP CALL', 'off'); }, 2500);
  }

  $('callBtn').onclick = () => { if (state === 'idle') startCall(); else endCall(); };
  $('backBtn').onclick = () => { if (state !== 'idle') endCall(); };
  $('muteBtn').onclick = async () => {
    muted = !muted;
    $('muteBtn').classList.toggle('on', muted);
    if (muted && state === 'listen') { await stopRecorder(true); setState('muted'); }
    else if (!muted && state === 'muted') startListening();
  };
  $('ccBtn').onclick = () => { captions = !captions; store.set('capri-caps', captions); paintSettings(); };
  $('spkBtn').onclick = () => { barge = !barge; store.set('capri-barge', barge); paintSettings(); };
  $('kbBtn').onclick = () => { const t = $('typebar'); t.classList.toggle('show'); $('kbBtn').classList.toggle('on', t.classList.contains('show')); if (t.classList.contains('show')) $('typed').focus(); };
  $('typebar').onsubmit = e => {
    e.preventDefault();
    const v = $('typed').value.trim();
    if (!v || state === 'idle') return;
    $('typed').value = '';
    hush();
    sendText(v);
  };
  // tap her face while she talks to cut in
  wrap.onclick = () => { if (state !== 'speak') return; hush(); if (lastHer) lastHer.classList.add('cut'); resumeAfterTurn(); };

  // menu
  $('menuBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('show'); };
  document.addEventListener('click', e => { if (!$('menu').contains(e.target)) $('menu').classList.remove('show'); });
  $('mBarge').onclick = () => { barge = !barge; store.set('capri-barge', barge); paintSettings(); };
  $('mCaps').onclick = () => { captions = !captions; store.set('capri-caps', captions); paintSettings(); };
  $('mClear').onclick = () => { log.innerHTML = ''; typingEl = null; $('menu').classList.remove('show'); };
  $('mFaces').onclick = () => {
    faces = {fv: '', imgs: {}}; store.set('capri-faces', faces); fillers = {v: '', clips: {}}; store.set('capri-fillers', fillers); $('menu').classList.remove('show');
    if (state !== 'idle' && session) post(MARK + session + '-0 faces').catch(() => {});
    else addMsg(true, 'I’ll send my faces again when you call.');
  };

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state !== 'idle') {
      try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      if (!es || es.readyState === 2) listenForHer();
    }
  });
})();
</script>
<script>
// ================= the phone app: HOME · LIFE · GYM, synced with the laptop's life planner =================
(() => {

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  const ok = s => /^[-_A-Za-z0-9]{8,64}$/.test(s || '');
  const c0 = store.get('capri-call', null);
  const cfg = c0 && ok(c0.o) && ok(c0.i) ? {out: c0.o, inn: c0.i, life: c0.o + '-life'} : null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));
  const usd = (v, sign) => { const a = Math.abs(v || 0); const t = '$' + a.toLocaleString('en-US', {minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2}); return (v < 0 ? '-' : sign && v > 0 ? '+' : '') + t; };
  const num = v => (Math.round((v || 0) * 10) / 10).toLocaleString('en-US');
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const todayKey = () => dayKey(new Date());
  const ICON = {
    budget: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M7 15h4"/><circle cx="17" cy="15" r="1.4" fill="currentColor"/></svg>',
    habits: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/></svg>',
    fitness: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12h2M20 12h2M6 8v8M18 8v8M4 9.5v5M20 9.5v5M6 12h12"/></svg>',
    ach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m3 8.5 3.2 3L13 4.5"/></svg>',

  const CATS_OUT = ['food', 'transport', 'shopping', 'bills', 'fun', 'school', 'other'], CATS_IN = ['job', 'gift', 'sold', 'other'];
  function subBudget() {

      <div class="chips"><button class="chip ${!moneyIn ? 'on' : ''}" data-a="mdir" data-v="out">SPENT</button><button class="chip ${moneyIn ? 'on' : ''}" data-a="mdir" data-v="in">EARNED</button></div>

  // ---------------------------------------------------------- SCHOOL
  let quiz = null;            // {list, i, show, right, wrong}
  const dayBit = d => 1 << ((d.getDay() + 6) % 7);
  const atTime = (d, hhmm) => { const p = (hhmm || '0:0').split(':'); const x = new Date(d); x.setHours(+p[0] || 0, +p[1] || 0, 0, 0); return x.getTime(); };
  function classesOn(d) { const sc = S.school || {}; return (sc.classes || []).filter(c => c.days & dayBit(d)).sort((a, b) => a.start < b.start ? -1 : 1); }
  function classNow() { const now = Date.now(), d = new Date(); return classesOn(d).find(c => now >= atTime(d, c.start) - 15 * 60000 && now <= atTime(d, c.end)) || null; }
  function dueTxt(ms) {

    const t = hm(ms).toUpperCase();
    if (ms < Date.now()) return days >= 0 ? 'WAS DUE ' + t : (-days) + (days === -1 ? ' DAY' : ' DAYS') + ' LATE';
    if (days === 0) return 'TODAY ' + t;
    if (days === 1) return 'TOMORROW ' + t;
    if (days < 7) return d.toLocaleDateString('en-US', {weekday: 'short'}).toUpperCase() + ' ' + t;

  }
  function lectureHtml() {

  // ---------------------------------------------------------- GYM

  let actx = null;
  function beep() {
    try {

      [0, .22, .44].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = i === 2 ? 1320 : 880; g.gain.setValueAtTime(.0001, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, actx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .18); o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .2); });
    } catch (e) {}

  function logSet(L, wt, reps) {

    if (pr) { if (ro) { L.reps = reps; L.best = reps; } else { L.best = wt; L.reps = reps; } }

  }
  function unlockA() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
  // the rest timer keeps working with the phone locked: a delayed push from ntfy to your Capri alerts
  async function scheduleRestPush() {
    if (!cfg || !G.on || !G.restEnd) return;
    const secs = Math.round((G.restEnd - Date.now()) / 1000);
    if (secs < 10) return;
    try {
      const r = await fetch(NTFY, {method: 'POST', body: JSON.stringify({topic: cfg.out, title: 'Capri // GYM', message: "Rest's over, choom. Next set.", tags: ['muscle'], priority: 4, delay: secs + 's'})});
      const j = await r.json(); G.schedId = j.id || ''; saveG();
    } catch (e) {}
  }
  function cancelRestPush() {
    if (!cfg || !G.schedId) return;
    fetch(NTFY + cfg.out + '/' + G.schedId, {method: 'DELETE'}).catch(() => {});
    G.schedId = ''; saveG();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (G.on && G.restEnd > Date.now() + 10000) scheduleRestPush(); }
    else {
      cancelRestPush();
      if (Date.now() - lastSync > 60000) askSnapshot();
      flush(); render();
    }
  });
  // talk your set: "bench 135 for 5", "pull ups 10", "same again", "185 for 3"
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  function parseSpoken(t) {
    t = t.toLowerCase().replace(/pounds?|lbs?/g, '').replace(/\bby\b|\btimes\b|×/g, ' x ').replace(/\bfor\b/g, ' x ').replace(/\s+/g, ' ').trim();
    if (/same( again)?|again|repeat/.test(t) && G.sets.length) { const x = G.sets[G.sets.length - 1]; return {L: findLift(x.lift), wt: x.wt, reps: x.reps}; }
    let m = t.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
    if (m) { const L = findLift(m[1]) || curLift(); return {L, wt: L && L.repsOnly ? 0 : +m[2], reps: L && L.repsOnly ? +m[3] : +m[3]}; }
    m = t.match(/^(.*?)\s*(\d+)\s*(?:reps?)?$/);
    if (m) { const L = findLift(m[1]) || curLift(); if (L && L.repsOnly) return {L, wt: 0, reps: +m[2]}; if (L) return {L, wt: +m[2], reps: G.reps}; }
    return null;
  }
  function micStart() {
    if (!SR) return;
    try { if (rec) { rec.abort(); rec = null; } } catch (e) {}
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    const b = $('gMic'); if (b) b.classList.remove('ghost');
    rec.onresult = e => {
      const t = e.results[0][0].transcript, p = parseSpoken(t);
      if (!p || !p.L) { toast('DIDN\'T CATCH THAT: “' + t + '”', 'r'); return; }
      if (p.wt) G.wt = p.wt; G.reps = p.reps; G.ex = p.L.name;
      logSet(p.L, p.wt, p.reps);
    };
    rec.onerror = () => toast('MIC NOT AVAILABLE HERE', 'r');
    rec.onend = () => { const bb = $('gMic'); if (bb) bb.classList.add('ghost'); rec = null; };
    try { rec.start(); } catch (e) {}
  }

  // ---------------------------------------------------------- tabs + rendering
  const PAGES = {home: ['vHome', 'homeP', pageHome], life: ['vLife', 'lifeP', pageLife], gym: ['vGym', 'gymP', pageGym], school: ['vSchool', 'schoolP', pageSchool]};
  function render() {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.closest('.lp')) { pendingRender = true; return; }
    pendingRender = false;
    const p = PAGES[tab]; if (!p) return;
    const el = $(p[1]), top = el.scrollTop;
    el.innerHTML = p[2]();
    el.scrollTop = top;
    gymTick();
    $('liveDot').classList.toggle('on', !!S && !offline);
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 50));
  function setTab(t) {
    tab = t; store.set('capri-tab', t);
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    $(t === 'call' ? 'vCall' : PAGES[t][0]).classList.add('on');
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    const title = document.querySelector('.titlebar .title');
    if (title) title.textContent = t === 'call' ? 'Capri' : t === 'gym' ? 'Gym' : t === 'life' ? 'Life' : t === 'school' ? 'School' : 'Capri';
    if (t !== 'call') { const el = $(PAGES[t][1]); render(); el.scrollTop = 0; }
  }
  document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  const val = id => { const e = $(id); return e ? e.value.trim() : ''; };
  const armed = {};
  function onTap(e) {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, v = b.dataset.v;
    switch (a) {
      case 'go': sub = v; store.set('capri-lsub', v); setTab('life'); return;
      case 'tab': setTab(v); return;
      case 'sub': sub = v; store.set('capri-lsub', v); selGroup = ''; render(); $('lifeP').scrollTop = 0; return;
      case 'callnow': setTab('call'); setTimeout(() => { const cb = $('callBtn'); if (cb && $('callLbl').textContent.trim() === 'CALL') cb.click(); }, 50); return;
      case 'hab': {
        if (!S) return;
        const h = S.habits.find(x => x.id === v); if (!h) return;
        const d = b.dataset.d || todayKey(), on = !habitDone(h, d);
        if (on) h.days.push(d); else h.days = h.days.filter(x => x !== d);
        if (d === todayKey()) h.streak = Math.max(0, h.streak + (on ? 1 : -1));
        act('habittoggle', h.id + ' ' + d + ' ' + (on ? 'on' : 'off'), true);
        if (on && d === todayKey()) toast(h.name.toUpperCase() + ' ✓', 'c');
        store.set('capri-life', S); render(); return;
      }
      case 'mdir': moneyIn = v === 'in'; render(); return;
      case 'mcat': moneyCat = v; render(); return;
      case 'mlog': {
        const amt = parseFloat(val('mAmt')); if (!(amt > 0)) { toast('ENTER AN AMOUNT', 'r'); return; }
        const note = val('mNote').replace(/\s+/g, ' ');
        act('money', (moneyIn ? '+' : '-') + amt + ' ' + moneyCat + (note ? ' ' + note : ''));
        if (S) {
          S.recent.unshift({id: 'tmp' + Date.now(), at: Date.now(), amt: moneyIn ? amt : -amt, cat: moneyCat, note});
          if (moneyIn) S.monthIn += amt; else S.monthOut += amt;
        }
        $('mAmt').value = ''; $('mNote').value = ''; $('mAmt').blur(); $('mNote').blur();
        render(); return;
      }
      case 'limit': { const n = parseFloat(val('limAmt')); if (!(n > 0)) return; act('limit', String(n)); if (S) S.limit = n; render(); return; }
      case 'limitoff': act('limit', 'off'); if (S) S.limit = 0; render(); return;
      case 'gadd': { act('goaladd', v + ' ' + b.dataset.n); const g = S && S.goals.find(x => x.id === v); if (g) g.saved += +b.dataset.n; render(); return; }
      case 'gaddc': { const n = parseFloat(val('ga_' + v)); if (!(n > 0)) return; act('goaladd', v + ' ' + n); const g = S && S.goals.find(x => x.id === v); if (g) g.saved += n; render(); return; }
      case 'goalnew': { const n = val('gName'), t = parseFloat(val('gAmt')); if (!n || !(t > 0)) { toast('NAME + TARGET', 'r'); return; } act('goal', n + ' ' + t); if (S) S.goals.push({id: 'tmp', name: n, target: t, saved: 0, due: 0, done: false}); render(); return; }
      case 'billnew': { const n = val('bName'), t = parseFloat(val('bAmt')), d = parseInt(val('bDay'), 10); if (!n || !(t > 0)) { toast('NAME + AMOUNT', 'r'); return; } act('bill', n + ' ' + t + (d >= 1 && d <= 31 ? ' on the ' + d : '')); return; }
      case 'habnew': { const n = val('hName'); if (!n) return; act('habitadd', n); if (S) S.habits.push({id: 'tmp', name: n, days: [], streak: 0, best: 0}); render(); return; }
      case 'habpre': act('habitadd', v); if (S) S.habits.push({id: 'tmp', name: v, days: [], streak: 0, best: 0}); render(); return;
      case 'del': {
        // two taps to delete: the first one arms the ×
        const k = b.dataset.k + v;
        if (!armed[k]) { armed[k] = 1; b.classList.add('arm'); b.textContent = 'DEL?'; setTimeout(() => { delete armed[k]; if (b.isConnected) { b.classList.remove('arm'); b.textContent = '×'; } }, 2500); return; }
        delete armed[k];
        act(b.dataset.k, v);
        if (S) { const f = x => x.id !== v; S.goals = S.goals.filter(f); S.bills = S.bills.filter(f); S.habits = S.habits.filter(f); S.recent = S.recent.filter(f); if (S.rewards) S.rewards.items = S.rewards.items.filter(f); }
        render(); return;
      }
      case 'achf': achFilter = v; render(); return;
      case 'pdone': act('plandone', v); if (S && S.plan) { const p = S.plan.find(x => x.id === v); if (p) p.state = 'done'; } render(); return;
      case 'pskip': act('planskip', v); if (S && S.plan) { const p = S.plan.find(x => x.id === v); if (p) p.state = 'skipped'; } render(); return;
      case 'replan': act('replan', ''); toast('MAKING A FRESH PLAN...', 'c'); return;
      case 'fstart': act('focus', v); if (S) { S.focusOn = true; S.focusUntil = +v ? Date.now() + v * 60000 : 0; } render(); return;
      case 'fstop': act('focusstop', ''); if (S) S.focusOn = false; render(); return;
      case 'jmood': { const d = b.dataset.d, ta = $('jt_' + d); if (ta) jDraft[d] = ta.value; jMood[d] = jMood[d] === v ? '' : v; render(); return; }
      case 'jedit': { if (tab !== 'life') { sub = 'journal'; setTab('life'); } jEdit = v === todayKey() ? '' : v; render(); $('lifeP').scrollTop = 0; return; }
      case 'jsave': case 'jdel': {
        const ta = $('jt_' + v), text = a === 'jdel' ? '' : (ta ? ta.value.trim() : ''), mood = a === 'jdel' ? '' : (jMood[v] || '');
        if (a === 'jsave' && !text && !mood) { toast('WRITE A LINE OR PICK A MOOD', 'r'); return; }
        if (a === 'jdel') { const k = 'jdel' + v; if (!armed[k]) { armed[k] = 1; b.textContent = 'SURE?'; setTimeout(() => { delete armed[k]; if (b.isConnected) b.textContent = 'DELETE'; }, 2500); return; } delete armed[k]; }
        act('journalday', v + ' ' + (mood || '-') + '\n' + text);
        if (S) {
          S.journal = (S.journal || []).filter(j => j.day !== v);
          if (text || mood) { S.journal.push({day: v, mood, text}); S.journal.sort((x, y) => x.day < y.day ? 1 : -1); }
          S.journalCount = S.journal.length;
        }
        delete jDraft[v]; delete jMood[v]; if (ta) ta.blur(); jEdit = '';
        render(); return;
      }
      case 'wset': { const n = val('gw_' + v); if (!n) return; act('watch', v + ' | ' + n); const g = S && S.goals.find(x => x.id === v); if (g) g.watch = n; render(); return; }
      case 'woff': { act('watch', v + ' | off'); const g = S && S.goals.find(x => x.id === v); if (g) { g.watch = ''; delete g.price; } render(); return; }
      case 'wcheck': act('pricecheck', v); return;
      case 'grp': selGroup = selGroup === v ? '' : v; render(); return;
      case 'sex': act('sex', v, true); if (S) S.sex = v; render(); return;
      case 'exnew': { const n = val('exName'), g = val('exGrp') || 'chest'; if (!n) return; act('lift', g + ': ' + n); return; }
      case 'liftgo': { const L = findLift(v); const sg = S && S.suggest && S.suggest[v]; G.ex = v; if (sg) { if (sg.wt) G.wt = sg.wt; if (sg.reps) G.reps = sg.reps; } else { if (L && !L.repsOnly && L.best) G.wt = L.best; if (L && L.reps) G.reps = L.reps; } saveG(); setTab('gym'); return; }
      case 'gymstart':
        if (!G.on) { G = {on: true, start: Date.now(), sets: [], ex: G.ex, wt: G.wt, reps: G.reps, restEnd: 0, restDur: 0, rest: G.rest || 90, schedId: ''}; saveG(); act('workout', '', true); unlockA(); toast('GYM MODE ON · LET\'S WORK', ''); }
        setTab('gym'); return;
      case 'gymend': {
        const mins = Math.round((Date.now() - G.start) / 60000), sets = G.sets.length, prs = G.sets.filter(x => x.pr).length;
        if (sets) act('gymdone', mins + ' ' + sets + ' ' + prs);
        cancelRestPush();
        G.on = false; G.restEnd = 0; G.sets = []; saveG();
        toast('DONE · ' + mins + ' MIN · ' + sets + ' SETS' + (prs ? ' · ' + prs + ' PR' + (prs > 1 ? 'S' : '') : ''), '');
        render(); return;
      }
      case 'restset': G.rest = +v; saveG(); render(); return;
      case 'rest30': if (G.restEnd > Date.now()) { G.restEnd += 30000; G.restDur += 30; } else { G.restEnd = Date.now() + 30000; G.restDur = 30; } saveG(); gymTick(); return;
      case 'restskip': G.restEnd = 0; saveG(); gymTick(); return;
      case 'ex': { G.ex = v; const L = findLift(v); const last = G.sets.slice().reverse().find(x => x.lift === v); const sg = S && S.suggest && S.suggest[v]; if (last) { G.wt = last.wt || G.wt; G.reps = last.reps; } else if (sg) { if (sg.wt) G.wt = sg.wt; if (sg.reps) G.reps = sg.reps; } else if (L) { if (!L.repsOnly && L.best) G.wt = L.best; if (L.reps) G.reps = L.reps; } saveG(); render(); return; }
      case 'usesugg': { const sg = S && S.suggest && S.suggest[v]; if (sg) { if (sg.wt) G.wt = sg.wt; if (sg.reps) G.reps = sg.reps; saveG(); render(); } return; }
      case 'liftview': liftView = liftView === v ? '' : v; if (tab !== 'life') { sub = 'fitness'; setTab('life'); } render(); setTimeout(() => { const el = document.querySelector('#lifeP .panel.y [data-a=liftclose]'); if (el) el.closest('.panel').scrollIntoView({behavior: 'smooth', block: 'start'}); }, 30); return;
      case 'liftclose': liftView = ''; render(); return;
      case 'wlog': { const n = parseFloat(val('wIn')); if (!(n > 50)) { toast('ENTER YOUR WEIGHT', 'r'); return; } act('weight', String(n)); if (S) { S.weights = (S.weights || []).filter(w => w[0] !== todayKey()); S.weights.push([todayKey(), n]); S.weightNow = n; } $('wIn').value = ''; $('wIn').blur(); render(); return; }
      case 'wgoal': { const n = parseFloat(val('wGoal')); if (!(n > 50)) return; act('weight', 'goal ' + n); if (S) S.weightGoal = n; render(); return; }
      case 'wrem': act('weight', 'remind ' + v); if (S) S.weighMask = {off: 0, daily: 127, mwf: 21, mondays: 1}[v]; render(); return;
      case 'split': act('split', v); if (S && S.split && v !== 'next') S.split.id = v === 'off' ? '' : v; toast(v === 'next' ? 'SKIPPING TO THE NEXT DAY...' : 'SETTING UP YOUR SPLIT...', 'c'); render(); return;
      case 'wt': G.wt = Math.max(0, Math.min(1500, G.wt + +v)); saveG(); { const e = $('gWt'); if (e) e.innerHTML = num(G.wt) + '<small> LB</small>'; } return;
      case 'reps': G.reps = Math.max(1, Math.min(100, G.reps + +v)); saveG(); { const e = $('gReps'); if (e) e.textContent = G.reps; } return;
      case 'logset': logSet(curLift(), G.wt, G.reps); return;
      case 'mic': unlockA(); micStart(); return;
      case 'qstart': if (!S || !(S.cards || []).length) return; quiz = {list: S.cards.slice(), i: 0, show: false, right: 0, wrong: 0}; if (tab !== 'school') setTab('school'); else render(); $('schoolP').scrollTop = 0; return;
      case 'qshow': if (quiz) { quiz.show = true; render(); } return;
      case 'qgrade': {
        if (!quiz) return;
        const c = quiz.list[quiz.i], ok = v === '1'; if (!c) return;
        act('cardgrade', c.d + ' ' + c.i + ' ' + (ok ? 'right' : 'wrong'), true);
        if (ok) { quiz.right++; if (S) { S.cards = S.cards.filter(x => !(x.d === c.d && x.i === c.i)); S.cardsDue = Math.max(0, (S.cardsDue || 1) - 1); } }
        else { quiz.wrong++; quiz.list.push(c); }
        quiz.i++; quiz.show = false; render(); return;
      }
      case 'qend': quiz = null; store.set('capri-life', S); render(); return;
      case 'lec': act('lecture', v); if (S && S.lecture && v === 'stop') { S.lecture.on = false; S.lecture.writing = true; } toast(v === 'stop' ? 'STOPPING...' : 'STARTING NOTES ON THE LAPTOP...', 'c'); render(); return;
      case 'tdone': case 'tundo': {
        act(a === 'tdone' ? 'taskdone' : 'taskundo', v);
        if (S && S.school) {
          const sc = S.school;
          if (a === 'tdone') { const t = sc.tasks.find(x => x.id === v); sc.tasks = sc.tasks.filter(x => x.id !== v); if (t) (sc.done = sc.done || []).unshift({id: t.id, title: t.title, course: t.course, doneAt: Date.now()}); toast('CHECKED OFF ✓', 'c'); }
          else { const t = (sc.done || []).find(x => x.id === v); sc.done = (sc.done || []).filter(x => x.id !== v); if (t) sc.tasks.push({id: t.id, title: t.title, course: t.course, due: 0, kind: 'todo', parent: ''}); }
        }
        render(); return;
      }
      case 'tbreak': act('breakdown', v); toast('PLANNING THE STEPS...', 'c'); return;
      case 'tadd': {
        const t = val('tTitle'); if (!t) { toast('WHAT\'S THE ASSIGNMENT?', 'r'); return; }
        const d = val('tDue'), c = val('tCourse');
        act('taskadd', t.replace(/\|/g, '/') + '|' + c + '|' + d + '|homework');
        if (S && S.school) S.school.tasks.push({id: 'tmp' + Date.now(), title: t, course: c, due: d ? new Date(d).getTime() : 0, kind: 'homework', parent: ''});
        $('tTitle').value = ''; $('tTitle').blur(); render(); return;
      }
      case 'rcards': act('cardsmake', v); toast('MAKING FLASHCARDS...', 'c'); if (S && S.readings) { const r = S.readings.find(x => x.id === v); if (r) r.cards = true; } render(); return;
      case 'slp': act('sleep', v); if (S && S.sleep) S.sleep.bedAt = v === 'bed' ? Date.now() : 0; toast(v === 'bed' ? 'GOODNIGHT, CHOOM' : v === 'up' ? 'MORNING!' : 'OKAY', 'c'); render(); return;
      case 'slph': { const h = parseFloat(val('slpH')); if (!(h >= 1 && h <= 16)) { toast('HOW MANY HOURS?', 'r'); return; } act('sleep', 'hours ' + h); const e = $('slpH'); if (e) { e.value = ''; e.blur(); } return; }
      case 'redeem': {
        const k = 'rd' + v;
        if (!armed[k]) { armed[k] = 1; b.textContent = 'SURE?'; setTimeout(() => { delete armed[k]; if (b.isConnected) b.textContent = 'CASH IN'; }, 2500); return; }
        delete armed[k]; act('redeem', v);
        if (S && S.rewards) { const r = S.rewards.items.find(x => x.id === v); if (r) { if (r.kind === 'body') S.rewards.body -= r.cost; else S.rewards.cred -= r.cost; r.last = Date.now(); S.rewards.log = [{name: r.name, cost: r.cost, kind: r.kind, at: Date.now()}].concat(S.rewards.log || []); } }
        render(); return;
      }
      case 'rwnew': { const n = val('rwName'), c = parseInt(val('rwCost'), 10); if (!n || !(c > 0)) { toast('NAME + COST', 'r'); return; } act('rewardadd', n.replace(/\|/g, '/') + '|' + c + '|' + v); if (S && S.rewards) S.rewards.items.push({id: 'tmp' + Date.now(), name: n.toUpperCase(), cost: c, kind: v, last: 0}); render(); return; }
    }
  }
  ['homeP', 'lifeP', 'gymP', 'schoolP'].forEach(id => $(id).addEventListener('click', onTap));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || !e.target.closest('.lp')) return;
    const form = e.target.closest('.form'); const btn = form && form.querySelector('[data-a]');
    if (btn) { e.preventDefault(); e.target.blur(); setTimeout(() => btn.click(), 60); }
  });

  setTab(PAGES[tab] || tab === 'call' ? tab : 'home');
  setInterval(gymTick, 500);
  setInterval(() => { const f = $('fLeft'); if (f) f.textContent = focusLeftTxt(); }, 1000);
  setInterval(() => { if (tab !== 'call') drawSync(); }, 30000);
  if (cfg) { listen(); pollLatest().then(askSnapshot); flush(); }
})();
</script>
</body>
</html>
