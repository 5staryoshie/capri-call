<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri">
<meta name="theme-color" content="#d6564c">
<title>Capri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#e85c50; --coral-dim:#963430; --status:#d6564c; --status-ink:#280c0c; --title:#4a1416;
    --body-top:#2c0e12; --body-bot:#10090c; --bar:#762626; --field:#963632;
    --cyan:#5ee2ec; --cyan-ink:#96f0f6; --amber:#ecac3a; --amber-ink:#f8c860; --ink:#f6e2dc; --dim:#b07c74; --red:#ff3b4e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--body-bot);color:var(--ink);overflow:hidden;
    font:500 16px/1.3 "Barlow Semi Condensed","Bahnschrift","Arial Narrow",-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
  .phone{position:fixed;inset:0;display:flex;flex-direction:column;
    background:linear-gradient(var(--body-top),var(--body-bot))}
  /* faint vertical grid + scanlines over the body, like the messenger template */
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(90deg,rgba(255,120,110,.04) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  .phone > *{position:relative;z-index:1}

  /* ---- coral status bar */
  .status{background:var(--status);color:var(--status-ink);padding:calc(env(safe-area-inset-top) + 4px) 14px 4px;
    display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.6px}
  .wave{display:flex;align-items:center;gap:2px;height:14px}
  .wave i{display:block;width:2px;background:var(--status-ink);border-radius:1px;height:4px;transition:height .08s linear}
  .status .label{flex:1}
  .status .clock{font-variant-numeric:tabular-nums}
  .batt{width:20px;height:10px;border:1.4px solid var(--status-ink);position:relative;margin-left:2px}
  .batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--status-ink)}
  .batt b{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:75%;background:var(--status-ink)}

  /* ---- title bar */
  .titlebar{background:var(--title);border-bottom:1.5px solid var(--coral);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .sq{width:30px;height:30px;border:1.6px solid var(--coral);background:transparent;display:grid;place-items:center;padding:0;color:var(--coral)}
  .sq:active{background:rgba(232,92,80,.25)}
  .sq svg{width:16px;height:16px}
  .title{font-weight:700;font-size:25px;color:var(--cyan);letter-spacing:.5px;text-shadow:0 0 12px rgba(94,226,236,.45)}

  /* ---- stage: her face */
  .stage{display:flex;flex-direction:column;align-items:center;padding:18px 16px 8px}
  .frame{position:relative;width:min(46vw,190px);aspect-ratio:1;
    --cut:16px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    background:var(--coral);padding:2px;transition:background .3s}
  .frame-wrap{position:relative;filter:drop-shadow(0 0 10px rgba(232,92,80,.45));transition:filter .3s}
  .frame-wrap.listen{filter:drop-shadow(0 0 12px rgba(94,226,236,.55))}
  .frame-wrap.listen .frame{background:var(--cyan)}
  .frame-wrap.speak .frame{background:var(--amber)}
  .frame-wrap.speak{animation:talk .5s ease-in-out infinite alternate}
  @keyframes talk{from{filter:drop-shadow(0 0 6px rgba(236,172,58,.35))}to{filter:drop-shadow(0 0 18px rgba(236,172,58,.75))}}
  .frame-in{position:relative;width:100%;height:100%;overflow:hidden;
    clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px));background:#1a0a0d}
  .frame-in img{width:100%;height:100%;object-fit:cover;display:block}
  .frame-in .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);font-weight:700;font-size:64px;letter-spacing:-2px}
  .frame-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  .glitch .frame-in img{animation:glitch .28s steps(2) 1}
  @keyframes glitch{
    0%{transform:translate(3px,-2px);filter:hue-rotate(40deg) saturate(1.6);clip-path:inset(10% 0 55% 0)}
    25%{transform:translate(-4px,1px);clip-path:inset(60% 0 8% 0)}
    50%{transform:translate(2px,2px);filter:hue-rotate(-30deg);clip-path:inset(30% 0 35% 0)}
    100%{transform:none;filter:none;clip-path:inset(0)}}
  .ticks{position:absolute;inset:-9px;pointer-events:none}
  .ticks i{position:absolute;width:14px;height:14px;border-color:var(--cyan);border-style:solid;opacity:.7}
  .ticks i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}.ticks i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}
  .ticks i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}.ticks i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}

  .state{margin-top:14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:2px;color:var(--dim);
    border:1.3px solid currentColor;padding:4px 12px 4px 10px;min-height:28px}
  .state .dot{width:8px;height:8px;background:currentColor;border-radius:50%}
  .state.live{color:var(--cyan)} .state.busy{color:var(--amber)} .state.warn{color:#ffb35c} .state.off{color:var(--coral)}
  .state.live .dot,.state.busy .dot{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .viz{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:22px;margin-top:10px}
  .viz i{width:4px;height:3px;background:var(--coral-dim);transition:height .07s linear,background .2s}

  /* ---- conversation: messenger boxes */
  .log{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 10px;-webkit-overflow-scrolling:touch;
    -webkit-user-select:text;user-select:text;mask-image:linear-gradient(transparent 0,#000 18px)}
  .log.hide{visibility:hidden}
  .msg{display:flex;flex-direction:column;margin:10px 0;max-width:84%;animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .who{font-size:12px;letter-spacing:.6px;margin:0 0 3px 1px;font-weight:600}
  .msg .box{border:1.3px solid;padding:6px 10px 7px;font-size:16.5px;line-height:1.3;word-wrap:break-word}
  .msg.her{align-self:flex-start}
  .msg.her .who{color:var(--amber)} .msg.her .box{border-color:var(--amber);background:rgba(236,172,58,.22);color:var(--amber-ink)}
  .msg.you{align-self:flex-end;align-items:flex-end;margin-left:auto}
  .msg.you .who{color:var(--cyan)} .msg.you .box{border-color:var(--cyan);background:rgba(94,226,236,.18);color:var(--cyan-ink)}
  .msg.you.pending .box{opacity:.75}
  .msg.cut .box::after{content:" —";opacity:.6}
  .hint{margin:18px auto 0;max-width:290px;text-align:center;color:var(--dim);font-size:14px;line-height:1.45;border-top:1px solid rgba(232,92,80,.3);padding-top:12px}
  .hint b{color:var(--cyan);font-weight:600}
  .typing{display:flex;align-items:center;gap:7px;color:var(--amber);font-size:13px;letter-spacing:.5px;margin:6px 0 2px;font-weight:600}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:bounce 1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,100%{opacity:.35;transform:none}40%{opacity:1;transform:translateY(-3px)}}
  .dots::after{content:"";animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* ---- type bar */
  .typebar{display:none;gap:8px;padding:8px 12px;background:var(--bar);border-top:1.5px solid var(--coral)}
  .typebar.show{display:flex}
  .typebar input{flex:1;min-width:0;background:var(--field);border:1.3px solid var(--coral);color:#ffe4dc;padding:9px 10px;font:inherit;font-size:16px;outline:none;border-radius:0}
  .typebar input::placeholder{color:#e8b0a8}
  .typebar button{background:var(--coral);border:0;color:var(--bar);padding:0 12px;display:grid;place-items:center}
  .typebar button svg{width:22px;height:22px}

  /* ---- bottom bar: call controls */
  .bottombar{background:var(--bar);border-top:1.5px solid var(--coral);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ctl{width:52px;height:52px;border:1.6px solid var(--coral);background:rgba(232,92,80,.12);color:var(--coral);display:grid;place-items:center;padding:0;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .08s,background .15s}
  .ctl:active{transform:scale(.92)}
  .ctl svg{width:24px;height:24px}
  .ctl.on{background:var(--coral);color:var(--bar)}
  .big{flex:1;max-width:170px;height:56px;border:0;font:inherit;font-weight:700;font-size:20px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:8px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:transform .08s,filter .2s}
  .big:active{transform:scale(.95)}
  .big svg{width:24px;height:24px}
  .big.call{background:var(--cyan);color:#06181b;filter:drop-shadow(0 0 10px rgba(94,226,236,.6))}
  .big.end{background:var(--red);color:#fff;filter:drop-shadow(0 0 10px rgba(255,59,78,.55))}
  .bottombar .ctl.hidden{visibility:hidden}

  /* ---- menu */
  .menu{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:5;background:var(--title);border:1.5px solid var(--coral);min-width:230px;display:none;
    box-shadow:0 0 22px rgba(232,92,80,.35)}
  .menu.show{display:block;animation:pop .15s ease-out}
  .menu button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid rgba(232,92,80,.3);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;text-align:left}
  .menu button:last-child{border-bottom:0}
  .menu .tg{width:38px;height:20px;border:1.4px solid var(--coral);position:relative;flex:none;margin-left:14px}
  .menu .tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:13px;background:var(--coral);transition:left .15s,background .15s}
  .menu .tg.on{border-color:var(--cyan);background:rgba(94,226,236,.25)}
  .menu .tg.on::after{left:19px;background:var(--cyan)}

  .setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--body-bot);z-index:9}
  .setup.show{display:flex}
  .setup div{max-width:340px;color:var(--dim);border:1.5px solid var(--coral);padding:20px;background:var(--title)}
  .setup b{color:var(--cyan);display:block;font-size:22px;margin-bottom:8px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="label" id="slabel">CAPRI // VOICE LINK</div>
    <div class="clock" id="clock"></div>
    <div class="batt"><b></b></div>
  </div>
  <div class="titlebar">
    <button class="sq" id="backBtn" aria-label="End call"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 8 10 3.5v9z"/></svg></button>
    <div class="title">Capri</div>
    <button class="sq" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 5h9M3.5 8h9M3.5 11h9"/></svg></button>
  </div>

  <div class="stage">
    <div class="frame-wrap" id="frameWrap">
      <div class="ticks"><i></i><i></i><i></i><i></i></div>
      <div class="frame"><div class="frame-in" id="frameIn"><div class="ph" id="ph">C</div><img id="face" alt="" style="display:none"></div></div>
    </div>
    <div class="state off" id="state"><span class="dot"></span><span id="stateText">TAP CALL</span></div>
    <div class="viz" id="viz"></div>
  </div>

  <div class="log" id="log"></div>

  <form class="typebar" id="typebar" autocomplete="off">
    <input id="typed" placeholder="Type to Capri..." enterkeyhint="send">
    <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 11.5 22 3l-7.5 19-3-8.2z"/></svg></button>
  </form>

  <div class="bottombar">
    <button class="ctl hidden" id="muteBtn" aria-label="Mute"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
    <button class="ctl hidden" id="kbBtn" aria-label="Type"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2zm0 3h2v2h-2zM8 8h2v2H8zm0 3h2v2H8zm-1 2H5v-2h2zm0-3H5V8h2zm9 7H8v-2h8zm0-4h-2v-2h2zm0-3h-2V8h2zm3 3h-2v-2h2zm0-3h-2V8h2z"/></svg></button>
    <button class="big call" id="callBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg><span id="callLbl">CALL</span></button>
    <button class="ctl hidden" id="ccBtn" aria-label="Captions"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1z"/></svg></button>
    <button class="ctl hidden" id="spkBtn" aria-label="Interrupt by talking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h3l4-4v8l-4-4"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg></button>
  </div>
</div>

<div class="menu" id="menu">
  <button id="mBarge">Talk over her to interrupt<span class="tg" id="tgBarge"></span></button>
  <button id="mCaps">Show the conversation<span class="tg" id="tgCaps"></span></button>
  <button id="mClear">Clear this conversation</button>
  <button id="mFaces">Re-download her faces</button>
</div>

<div class="setup" id="setup"><div><b>Almost there</b>Open this page from the "Call Capri" link Capri sends to your iPhone (Hub &gt; Settings &gt; iPhone link &gt; Send call link). The link carries your private channel names.</div></div>

<script>
(() => {
  const NTFY = 'https://ntfy.sh/';
  const MARK = 'CAPRICALL1 ';
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // private channel names travel in the link's #hash (never sent to this site); remember them for the home-screen app
  function readCfg() {
    const h = new URLSearchParams(location.hash.slice(1));
    let o = h.get('o'), i = h.get('i');
    if (o && i) store.set('capri-call', {o, i});
    else { const c = store.get('capri-call', null); if (c) { o = c.o; i = c.i; } }
    const ok = s => /^[-_A-Za-z0-9]{8,64}$/.test(s || '');
    return ok(o) && ok(i) ? {out: o, inn: i, call: o + '-call'} : null;
  }
  const cfg = readCfg();
  if (!cfg) { $('setup').classList.add('show'); return; }

  // ---------------------------------------------------------- her faces (sent once by the laptop, kept on the phone)
  const ALIAS = {};
  let faces = store.get('capri-faces', {fv: '', imgs: {}});
  let curMood = 'calm';
  function setFace(m, glitch) {
    m = m || 'calm';
    const src = faces.imgs[m] || faces.imgs[ALIAS[m]] || faces.imgs.calm;
    if (!src) return;
    const img = $('face');
    if (img.src !== src) {
      img.src = src; img.style.display = 'block'; $('ph').style.display = 'none';
      if (glitch && m !== curMood) { const w = $('frameWrap'); w.classList.remove('glitch'); void w.offsetWidth; w.classList.add('glitch'); }
    }
    curMood = m;
  }
  setFace('calm');
  async function gotFace(j, url) {
    if (!url || !j.name) return;
    try {
      const b = await (await fetch(url)).blob();
      const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
      faces.imgs[j.name] = data; faces.fv = j.fv || faces.fv;
      store.set('capri-faces', faces);
      if (j.name === curMood || (j.name === 'calm' && !$('face').src)) setFace(curMood);
    } catch (e) { faces.imgs[j.name] = url; if (j.name === 'calm') setFace('calm'); }
  }

  // ---------------------------------------------------------- settings
  let barge = store.get('capri-barge', true), captions = store.get('capri-caps', true);
  function paintSettings() {
    $('tgBarge').classList.toggle('on', barge); $('spkBtn').classList.toggle('on', barge);
    $('tgCaps').classList.toggle('on', captions); $('ccBtn').classList.toggle('on', captions);
    $('log').classList.toggle('hide', !captions);
  }
  paintSettings();

  // ---------------------------------------------------------- the screen
  const statusEl = $('state'), wrap = $('frameWrap'), log = $('log');
  const VIZ = 22; for (let k = 0; k < VIZ; k++) $('viz').appendChild(document.createElement('i'));
  const vizBars = [...$('viz').children], waveBars = [...$('wave').children];
  let state = 'idle';            // idle | connecting | listen | send | think | speak | muted
  function setStatus(t, cls) { $('stateText').textContent = t; statusEl.className = 'state ' + (cls || ''); }
  function setState(s) {
    state = s;
    wrap.classList.toggle('listen', s === 'listen');
    wrap.classList.toggle('speak', s === 'speak');
    if (s === 'listen') setStatus('LISTENING', 'live');
    else if (s === 'send') setStatus('SENDING', 'busy');
    else if (s === 'think') setStatus('THINKING', 'busy');
    else if (s === 'speak') setStatus('SPEAKING', 'busy');
    else if (s === 'muted') setStatus('MUTED', 'off');
  }

  function scrollDown() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
  function addMsg(her, text, cls) {
    const h = log.querySelector('.hint'); if (h) h.remove();
    const m = document.createElement('div');
    m.className = 'msg ' + (her ? 'her' : 'you') + (cls ? ' ' + cls : '');
    m.innerHTML = '<div class="who"></div><div class="box"></div>';
    m.querySelector('.who').textContent = her ? 'Capri' : 'You';
    m.querySelector('.box').textContent = text;
    log.appendChild(m);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    scrollDown();
    return m;
  }
  log.innerHTML = '<div class="hint">Tap <b>CALL</b> and just talk. She hears when you stop.<br>Start talking while she speaks to <b>cut her off</b>.</div>';
  let typingEl = null;
  function showTyping(on) {
    if (on && !typingEl) { typingEl = document.createElement('div'); typingEl.className = 'typing'; typingEl.innerHTML = 'Capri is thinking <i></i><i></i><i></i>'; log.appendChild(typingEl); scrollDown(); }
    if (!on && typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ---------------------------------------------------------- talking to the laptop (ntfy)
  let session = '', turnN = 0, pendingTurn = null, turnTimer = null, laptopSeen = false, es = null, pendingYou = null, lastHer = null;
  function listenForHer() {
    if (es) es.close();
    es = new EventSource(NTFY + cfg.call + '/sse');
    es.onmessage = ev => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.event !== 'message') return;
      let j; try { j = JSON.parse(d.message || '{}'); } catch (e) { return; }
      if (!j.turn || !session || !String(j.turn).startsWith(session)) return;      // not for this call
      if (j.t === 'hi') {
        laptopSeen = true;
        if (j.fv && j.fv !== faces.fv) post(MARK + session + '-0 faces').catch(() => {});
        if (state === 'connecting') { setStatus('CONNECTED', 'live'); setTimeout(startListening, 350); }
        return;
      }
      if (j.t === 'face') { gotFace(j, d.attachment && d.attachment.url); return; }
      if (j.t === 'heard' && j.turn === pendingTurn) { showHeard(j.heard); return; }
      if (j.t === 'reply' && j.turn === pendingTurn) onReply(j, d.attachment && d.attachment.url);
    };
    es.onerror = () => { if (state !== 'idle') setStatus('RECONNECTING', 'warn'); };
    es.onopen = () => { if (state === 'listen') setState('listen'); };
  }
  async function post(body, query) {
    const r = await fetch(NTFY + cfg.inn + (query ? '?' + query : ''), {method: 'POST', body});
    if (!r.ok) throw new Error('ntfy ' + r.status);
  }
  function newTurn() { turnN++; return session + '-' + turnN; }

  function showHeard(text) {
    text = (text || '').trim();
    if (pendingYou) {
      if (text) { pendingYou.querySelector('.box').textContent = text; pendingYou.classList.remove('pending'); }
      else pendingYou.remove();
      pendingYou = null;
    } else if (text) addMsg(false, text);
    showTyping(true);
    if (state === 'send') setState('think');
  }

  function waitForReply(turn) {
    pendingTurn = turn;
    clearTimeout(turnTimer);
    turnTimer = setTimeout(() => {
      if (pendingTurn !== turn) return;
      pendingTurn = null; showTyping(false);
      if (pendingYou) { pendingYou.remove(); pendingYou = null; }
      addMsg(true, laptopSeen ? "Hm, I didn't get that one. Say it again?" : "Your laptop isn't answering. Is Capri running and online?");
      setStatus('NO ANSWER', 'warn');
      setTimeout(resumeAfterTurn, 1800);
    }, 70000);
  }

  async function sendVoice(blob) {
    const turn = newTurn();
    setState('send');
    pendingYou = addMsg(false, '', 'pending');
    pendingYou.querySelector('.box').innerHTML = '<span class="dots">hearing you</span>';
    try {
      await post(new Blob([blob]), 'filename=voice.' + recExt + '&message=' + encodeURIComponent(MARK + turn));
      setState('think'); waitForReply(turn);
    } catch (e) {
      if (pendingYou) { pendingYou.remove(); pendingYou = null; }
      addMsg(true, "Couldn't send that. Check your signal.");
      setStatus('SEND FAILED', 'warn'); setTimeout(resumeAfterTurn, 1500);
    }
  }

  async function sendText(text) {
    const turn = newTurn();
    await stopRecorder(true);
    addMsg(false, text);
    setState('send'); showTyping(true);
    try { await post(MARK + turn + '\n' + text); setState('think'); waitForReply(turn); }
    catch (e) { showTyping(false); addMsg(true, "Couldn't send that. Check your signal."); setTimeout(resumeAfterTurn, 1500); }
  }

  function onReply(j, audioUrl) {
    clearTimeout(turnTimer);
    pendingTurn = null;
    if (pendingYou) showHeard(j.heard);
    showTyping(false);
    lastHer = addMsg(true, j.text || '');
    setFace(j.mood || 'calm', true);
    if (state === 'idle') return;
    setState('speak'); speakStart = performance.now(); bargeMs = 0;
    if (audioUrl) {
      player.src = audioUrl;
      player.onended = () => { if (state === 'speak') resumeAfterTurn(); };
      player.onerror = () => speakFallback(j.text);
      const p = player.play();
      if (p && p.catch) p.catch(() => speakFallback(j.text));
    } else speakFallback(j.text);
  }

  function speakFallback(text) {
    if (!('speechSynthesis' in window) || !text) { setTimeout(() => { if (state === 'speak') resumeAfterTurn(); }, 1200 + 45 * (text || '').length); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1.15;
    u.onend = () => { if (state === 'speak') resumeAfterTurn(); };
    u.onerror = () => { if (state === 'speak') resumeAfterTurn(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  function hush() { try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }

  function resumeAfterTurn() {
    if (state === 'idle') return;
    setFace(curMood);
    if (muted) setState('muted'); else startListening();
  }

  // ---------------------------------------------------------- the mic: hands-free, it hears when you start and stop talking
  let stream = null, ctx = null, analyser = null, buf = null, rec = null, chunks = [], recType = '', recExt = 'm4a';
  let speechMs = 0, silenceMs = 0, listenStart = 0, heardAny = false, floor = 0.01, lastTick = 0;
  let speakStart = 0, bargeMs = 0, echoFloor = 0.02, lastLv = 0;
  let muted = false, wakeLock = null, callStart = 0, clockIv = null, vadIv = null;
  const player = new Audio(); player.playsInline = true; player.preload = 'auto';

  function pickType() {
    const types = [['audio/mp4', 'm4a'], ['audio/mp4;codecs=mp4a.40.2', 'm4a'], ['audio/webm;codecs=opus', 'webm'], ['audio/webm', 'webm']];
    for (const [t, e] of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { recType = t; recExt = e; return; }
    recType = ''; recExt = 'm4a';
  }
  async function ensureMic() {
    if (stream && stream.getAudioTracks().some(t => t.readyState === 'live')) return;
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
  }
  function startRecorder() {
    chunks = [];
    try { rec = recType ? new MediaRecorder(stream, {mimeType: recType}) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    if (!recType && rec.mimeType) recExt = rec.mimeType.includes('webm') ? 'webm' : 'm4a';
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start();
  }
  function stopRecorder(discard) {
    return new Promise(res => {
      if (!rec || rec.state === 'inactive') { rec = null; return res(null); }
      const r = rec; rec = null;
      r.onstop = () => res(discard ? null : new Blob(chunks, {type: r.mimeType || recType || 'audio/mp4'}));
      try { r.stop(); } catch (e) { res(null); }
    });
  }
  async function startListening(alreadyTalking) {
    if (state === 'idle' || muted) return;
    try { await ensureMic(); }
    catch (e) { setStatus('MIC BLOCKED', 'warn'); addMsg(true, 'I can’t hear you: allow the microphone in Settings > Safari > Microphone.'); return; }
    if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    await stopRecorder(true);
    startRecorder();
    speechMs = alreadyTalking ? 300 : 0; silenceMs = 0; heardAny = !!alreadyTalking; listenStart = performance.now(); lastTick = listenStart;
    setState('listen');
  }
  function level() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k] * buf[k];
    return Math.sqrt(s / buf.length);
  }

  // talking over her: a strong, steady voice while she speaks cuts her off (her own echo is mostly cancelled by the phone)
  function bargeTick(lv, dt, now) {
    if (!barge || now - speakStart < 450) return;
    const thr = Math.max(0.05, echoFloor * 3.4);
    if (lv > thr) bargeMs += dt;
    else { bargeMs = Math.max(0, bargeMs - dt * 2); echoFloor = echoFloor * 0.96 + Math.min(lv, 0.08) * 0.04; }
    if (bargeMs > 240) {
      bargeMs = 0;
      hush();
      if (lastHer) lastHer.classList.add('cut');
      startListening(true);
    }
  }

  async function vadTick() {
    const now = performance.now(), dt = Math.min(200, now - lastTick); lastTick = now;
    const lv = (state === 'listen' || state === 'speak') ? level() : 0;
    lastLv = lv;
    if (state === 'speak') { bargeTick(lv, dt, now); return; }
    if (state !== 'listen' || !rec) return;
    if (!heardAny) floor = floor * 0.97 + Math.min(lv, 0.05) * 0.03;
    const thr = Math.max(0.018, floor * 2.6);
    if (lv > thr) { speechMs += dt; silenceMs = 0; if (speechMs > 180) heardAny = true; }
    else { silenceMs += dt; if (!heardAny) speechMs = Math.max(0, speechMs - dt); }
    const long = now - listenStart;
    if (heardAny && (silenceMs > 800 || long > 28000)) {
      const blob = await stopRecorder(false);
      if (blob && blob.size > 1500) sendVoice(blob); else startListening();
      return;
    }
    if (!heardAny && long > 20000) startListening();      // keep clips small while it's quiet
  }

  // meters: your voice (cyan) while listening, her talking (amber), idle (coral)
  function drawMeters(t) {
    const speaking = state === 'speak', listening = state === 'listen';
    for (let k = 0; k < VIZ; k++) {
      let h;
      if (listening) h = 3 + Math.min(19, lastLv * 260 * (0.6 + 0.4 * Math.sin(k * 1.7 + t / 90)));
      else if (speaking) h = 4 + 14 * Math.abs(Math.sin(t / 110 + k * 0.6)) * (0.5 + 0.5 * Math.sin(t / 370 + k));
      else if (state === 'think' || state === 'send') h = 3 + 6 * Math.max(0, Math.sin(t / 160 - k * 0.45));
      else h = 3;
      vizBars[k].style.height = h.toFixed(1) + 'px';
      vizBars[k].style.background = listening ? 'var(--cyan)' : speaking ? 'var(--amber)' : (state === 'think' || state === 'send') ? 'var(--amber)' : 'var(--coral-dim)';
    }
    for (let k = 0; k < waveBars.length; k++) {
      const a = state === 'idle' ? 0.35 : (speaking ? Math.abs(Math.sin(t / 120 + k)) : listening ? Math.min(1, lastLv * 30 + 0.15) * (0.6 + 0.4 * Math.sin(t / 80 + k)) : 0.4);
      waveBars[k].style.height = (3 + 10 * a).toFixed(1) + 'px';
    }
    requestAnimationFrame(drawMeters);
  }
  requestAnimationFrame(drawMeters);

  // ---------------------------------------------------------- call controls
  function unlockAudio() {
    // iOS only lets sound play after a tap: play a blip of silence now so her replies can play later
    const sr = 8000, n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    player.src = URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    const p = player.play(); if (p && p.catch) p.catch(() => {});
    if ('speechSynthesis' in window) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  }
  function showControls(inCall) {
    ['muteBtn', 'kbBtn', 'ccBtn', 'spkBtn'].forEach(id => $(id).classList.toggle('hidden', !inCall));
    const b = $('callBtn');
    b.className = 'big ' + (inCall ? 'end' : 'call');
    $('callLbl').textContent = inCall ? 'END' : 'CALL';
  }
  function tickClock() {
    if (state === 'idle') { $('clock').textContent = new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}); return; }
    const s = Math.floor((Date.now() - callStart) / 1000);
    $('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  tickClock(); clockIv = setInterval(tickClock, 500);

  async function startCall() {
    unlockAudio(); pickType();
    session = Math.random().toString(36).slice(2, 8); turnN = 0; laptopSeen = false;
    showControls(true); $('slabel').textContent = 'CAPRI // VOICE LINK  ·  LIVE';
    state = 'connecting'; setStatus('CALLING', 'busy');
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); await ensureMic(); }
    catch (e) { setStatus('MIC BLOCKED', 'warn'); }
    listenForHer();
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    callStart = Date.now();
    vadIv = setInterval(vadTick, 50);
    try { await post(MARK + session + '-0 hello'); } catch (e) {}
    setTimeout(() => {
      if (state !== 'connecting') return;
      setStatus('NO LAPTOP YET', 'warn');
      startListening();
    }, 6000);
  }

  async function endCall() {
    if (state !== 'idle') post(MARK + session + '-0 bye').catch(() => {});
    state = 'idle';
    clearInterval(vadIv); clearTimeout(turnTimer); pendingTurn = null; showTyping(false);
    if (pendingYou) { pendingYou.remove(); pendingYou = null; }
    await stopRecorder(true);
    hush();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; analyser = null; }
    if (es) { es.close(); es = null; }
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
    showControls(false); $('typebar').classList.remove('show'); $('kbBtn').classList.remove('on');
    wrap.className = 'frame-wrap'; $('slabel').textContent = 'CAPRI // VOICE LINK';
    setStatus('CALL ENDED', 'off'); setFace('calm');
    setTimeout(() => { if (state === 'idle') setStatus('TAP CALL', 'off'); }, 2500);
  }

  $('callBtn').onclick = () => { if (state === 'idle') startCall(); else endCall(); };
  $('backBtn').onclick = () => { if (state !== 'idle') endCall(); };
  $('muteBtn').onclick = async () => {
    muted = !muted;
    $('muteBtn').classList.toggle('on', muted);
    if (muted && state === 'listen') { await stopRecorder(true); setState('muted'); }
    else if (!muted && state === 'muted') startListening();
  };
  $('ccBtn').onclick = () => { captions = !captions; store.set('capri-caps', captions); paintSettings(); };
  $('spkBtn').onclick = () => { barge = !barge; store.set('capri-barge', barge); paintSettings(); };
  $('kbBtn').onclick = () => { const t = $('typebar'); t.classList.toggle('show'); $('kbBtn').classList.toggle('on', t.classList.contains('show')); if (t.classList.contains('show')) $('typed').focus(); };
  $('typebar').onsubmit = e => {
    e.preventDefault();
    const v = $('typed').value.trim();
    if (!v || state === 'idle') return;
    $('typed').value = '';
    hush();
    sendText(v);
  };
  // tap her face while she talks to cut in
  wrap.onclick = () => { if (state !== 'speak') return; hush(); if (lastHer) lastHer.classList.add('cut'); resumeAfterTurn(); };

  // menu
  $('menuBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('show'); };
  document.addEventListener('click', e => { if (!$('menu').contains(e.target)) $('menu').classList.remove('show'); });
  $('mBarge').onclick = () => { barge = !barge; store.set('capri-barge', barge); paintSettings(); };
  $('mCaps').onclick = () => { captions = !captions; store.set('capri-caps', captions); paintSettings(); };
  $('mClear').onclick = () => { log.innerHTML = ''; typingEl = null; $('menu').classList.remove('show'); };
  $('mFaces').onclick = () => {
    faces = {fv: '', imgs: {}}; store.set('capri-faces', faces); $('menu').classList.remove('show');
    if (state !== 'idle' && session) post(MARK + session + '-0 faces').catch(() => {});
    else addMsg(true, 'I’ll send my faces again when you call.');
  };

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state !== 'idle') {
      try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      if (!es || es.readyState === 2) listenForHer();
    }
  });
})();
</script>
</body>
</html>
