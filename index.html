<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri">
<meta name="theme-color" content="#0c0812">
<link rel="apple-touch-icon" id="icon">
<title>Capri</title>
<style>
  :root{
    --bg:#0c0812; --ink:#f3eef6; --dim:#9a8fab; --pink:#ff1452; --cyan:#5ee2ec; --green:#1ef08c; --red:#ff3b4e;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  body{background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,20,82,.22), transparent 60%),
      radial-gradient(90% 60% at 50% 100%, rgba(94,226,236,.14), transparent 65%), var(--bg)}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 22px)}
  .top{text-align:center;margin-top:4vh}
  .name{font-size:34px;font-weight:600;letter-spacing:.5px}
  .status{margin-top:6px;color:var(--dim);font-size:16px;min-height:22px;transition:color .2s}
  .status.live{color:var(--cyan)}
  .status.warn{color:#ffb35c}
  .timer{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px;margin-top:2px;min-height:18px}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  .avatar{position:relative;width:min(58vw,250px);aspect-ratio:1;border-radius:50%}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;
       border:3px solid rgba(255,255,255,.14);transition:opacity .25s}
  .ring{position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--pink);opacity:.0;
       transform:scale(1);transition:transform .08s linear, opacity .3s, border-color .3s}
  .ring.b{inset:-30px;border-width:2px;opacity:0}
  .avatar.listen .ring{border-color:var(--cyan);opacity:.55}
  .avatar.speak .ring{border-color:var(--pink);opacity:.8}
  .avatar.think .ring{border-color:var(--pink);opacity:.5;animation:spin 1.4s linear infinite;border-style:dashed}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar.speak .ring.b{opacity:.35;animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{from{transform:scale(.92);opacity:.5}to{transform:scale(1.15);opacity:0}}

  .caption{width:100%;max-width:520px;min-height:84px;max-height:28vh;overflow:auto;text-align:center;
       padding:0 6px;margin-bottom:14px;-webkit-user-select:text;user-select:text}
  .caption .you{color:var(--dim);font-size:14px;margin-bottom:6px}
  .caption .her{font-size:17px}
  .caption.hide{visibility:hidden}

  .typebar{display:none;width:100%;max-width:520px;gap:8px;margin-bottom:14px}
  .typebar.show{display:flex}
  .typebar input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--line);color:var(--ink);
       border-radius:22px;padding:11px 16px;font-size:16px;outline:none}
  .typebar button{background:var(--pink);border:0;color:#fff;border-radius:22px;padding:0 16px;font-weight:600;font-size:15px}

  .vol{display:none;width:100%;max-width:360px;align-items:center;gap:12px;margin-bottom:18px;color:var(--dim)}
  .vol.show{display:flex}
  .vol svg{width:22px;height:22px;flex:none}
  .vol input{flex:1;min-width:0;height:30px;accent-color:var(--pink)}
  .vol .pct{width:46px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:22px;align-items:flex-start;justify-content:center}
  .ctl{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--dim);font-size:12px}
  .btn{width:66px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass);
       color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .15s, transform .1s}
  .btn:active{transform:scale(.94)}
  .btn svg{width:28px;height:28px}
  .btn.on{background:var(--ink);color:#111}
  .btn.hang{background:var(--red);color:#fff}
  .btn.go{background:var(--green);color:#03140b;width:76px;height:76px}
  .btn.go svg{width:34px;height:34px}

  .setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg)}
  .setup.show{display:flex}
  .setup div{max-width:360px;color:var(--dim)}
  .setup b{color:var(--ink);display:block;font-size:20px;margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="name">Capri</div>
    <div class="status" id="status">Tap to call</div>
    <div class="timer" id="timer"></div>
  </div>

  <div class="stage">
    <div class="avatar" id="avatar">
      <div class="ring b"></div>
      <div class="ring" id="ring"></div>
      <img id="face" alt="Capri">
    </div>
  </div>

  <div class="caption" id="caption"><div class="you" id="you"></div><div class="her" id="her"></div></div>

  <form class="typebar" id="typebar" autocomplete="off">
    <input id="typed" placeholder="Type to Capri..." enterkeyhint="send">
    <button type="submit">Send</button>
  </form>

  <div class="vol" id="volbar">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <input type="range" id="vol" min="0" max="200" step="5" value="100" aria-label="Capri's volume">
    <span class="pct" id="volPct">100%</span>
  </div>

  <div class="controls" id="idleCtl">
    <div class="ctl">
      <button class="btn go" id="callBtn" aria-label="Call Capri">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
      </button>
      <span>Call</span>
    </div>
  </div>

  <div class="controls" id="callCtl" style="display:none">
    <div class="ctl">
      <button class="btn" id="muteBtn" aria-label="Mute">
        <svg id="micIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
      </button>
      <span id="muteLbl">Mute</span>
    </div>
    <div class="ctl">
      <button class="btn" id="kbBtn" aria-label="Type">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2zm0 3h2v2h-2zM8 8h2v2H8zm0 3h2v2H8zm-1 2H5v-2h2zm0-3H5V8h2zm9 7H8v-2h8zm0-4h-2v-2h2zm0-3h-2V8h2zm3 3h-2v-2h2zm0-3h-2V8h2z"/></svg>
      </button>
      <span>Type</span>
    </div>
    <div class="ctl">
      <button class="btn" id="ccBtn" aria-label="Captions">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1z"/></svg>
      </button>
      <span>Captions</span>
    </div>
    <div class="ctl">
      <button class="btn hang" id="hangBtn" aria-label="End call">
        <svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
      </button>
      <span>End</span>
    </div>
  </div>
</div>

<div class="setup" id="setup"><div><b>Almost there</b>Open this page from the "Call Capri" link Capri sends to your iPhone (Hub &gt; Settings &gt; iPhone link &gt; Send call link). The link carries your private channel names.</div></div>

(() => {
  const NTFY = 'https://ntfy.sh/';
  const MARK = 'CAPRICALL1 ';
  const $ = id => document.getElementById(id);

  // private channel names travel in the link's #hash (never sent to this site); remember them for the home-screen app
  function readCfg() {
    const h = new URLSearchParams(location.hash.slice(1));
    let o = h.get('o'), i = h.get('i');
    try {
      if (o && i) localStorage.setItem('capri-call', JSON.stringify({o, i}));
      else { const c = JSON.parse(localStorage.getItem('capri-call') || 'null'); if (c) { o = c.o; i = c.i; } }
    } catch (e) {}
    const ok = s => /^[-_A-Za-z0-9]{8,64}$/.test(s || '');
    return ok(o) && ok(i) ? {out: o, inn: i, call: o + '-call'} : null;
  }
  const cfg = readCfg();
  if (!cfg) { $('setup').classList.add('show'); return; }

  const statusEl = $('status'), avatar = $('avatar'), ring = $('ring'), face = $('face');
  const FACES = window.CAPRI_FACES;
  const ALIAS = {look: 'calm', aside: 'smug', many: 'laugh'};

  let state = 'idle';            // idle | connecting | listen | send | think | speak | muted
  let session = Math.random().toString(36).slice(2, 8), turnN = 0, pendingTurn = null, turnTimer = null;
  let stream = null, ctx = null, analyser = null, buf = null, rec = null, chunks = [], recType = '', recExt = 'm4a';
  let speechMs = 0, silenceMs = 0, listenStart = 0, heardAny = false, floor = 0.01, lastTick = 0;
  let muted = false, captions = true, es = null, wakeLock = null, callStart = 0, clockIv = null, vadIv = null, laptopSeen = false;
  const player = new Audio(); player.playsInline = true; player.preload = 'auto';
  // her volume: 0 to 200%. iPhone ignores audio.volume, so her voice goes through a Web Audio gain instead
  let vol = 1, gain = null, herSrc = null;
  try { const v = parseFloat(localStorage.getItem('capri-vol')); if (!isNaN(v)) vol = Math.max(0, Math.min(2, v)); } catch (e) {}
  function ensureGain() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (!gain) { gain = ctx.createGain(); gain.connect(ctx.destination); }
    gain.gain.value = vol;
  }
  function applyVol() {
    if (gain) gain.gain.value = vol;
    player.volume = Math.min(1, vol);
    $('vol').value = Math.round(vol * 100);
    $('volPct').textContent = Math.round(vol * 100) + '%';
  }
  function stopHer() {
    if (herSrc) { const s = herSrc; herSrc = null; s.onended = null; try { s.stop(); } catch (e) {} }
    try { player.pause(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
  }
  async function playHer(url, text) {
    try {
      ensureGain();
      if (ctx.state === 'suspended') await ctx.resume();
      const r = await fetch(url);
      if (!r.ok) throw new Error('fetch ' + r.status);
      const data = await r.arrayBuffer();
      const audio = await new Promise((res, rej) => { const p = ctx.decodeAudioData(data, res, rej); if (p && p.then) p.then(res, rej); });
      if (state !== 'speak') return;
      stopHer();
      const s = ctx.createBufferSource();
      s.buffer = audio; s.connect(gain);
      s.onended = () => { if (herSrc === s) { herSrc = null; resumeAfterTurn(); } };
      herSrc = s; s.start();
    } catch (e) {
      if (state !== 'speak') return;
      // fallback: plain audio element (volume works up to 100% except on iPhone)
      player.src = url; player.volume = Math.min(1, vol);
      player.onended = () => resumeAfterTurn();
      player.onerror = () => speakFallback(text);
      const p = player.play();
      if (p && p.catch) p.catch(() => speakFallback(text));
    }
  }

  function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }
  function setFace(m) { m = ALIAS[m] || m; if (FACES[m]) face.src = FACES[m]; }
  function setState(s) {
    state = s;
    avatar.className = 'avatar' + (s === 'listen' ? ' listen' : s === 'speak' ? ' speak' : (s === 'think' || s === 'send') ? ' think' : '');
    if (s !== 'listen') ring.style.transform = '';
    if (s === 'listen') setStatus('Listening...', 'live');
    else if (s === 'send') setStatus('Sending...');
    else if (s === 'think') setStatus('Thinking...');
    else if (s === 'speak') setStatus('Speaking', 'live');
    else if (s === 'muted') setStatus('Muted');
  }
  function caption(you, her) {
    if (you !== undefined) $('you').textContent = you ? '"' + you + '"' : '';
    if (her !== undefined) $('her').textContent = her || '';
  }

  // ---------------------------------------------------------- talking to the laptop (ntfy)
  function listenForHer() {
    if (es) es.close();
    es = new EventSource(NTFY + cfg.call + '/sse');
    es.onmessage = ev => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.event !== 'message') return;
      let j; try { j = JSON.parse(d.message || '{}'); } catch (e) { return; }
      if (!j.turn || !String(j.turn).startsWith(session)) return;      // not for this call
      if (j.t === 'hi') { laptopSeen = true; if (state === 'connecting') { setStatus('Connected', 'live'); setTimeout(startListening, 350); } return; }
      if (j.t === 'reply' && j.turn === pendingTurn) onReply(j, d.attachment && d.attachment.url);
    };
    es.onerror = () => { if (state !== 'idle') setStatus('Reconnecting...', 'warn'); };
    es.onopen = () => { if (state === 'listen') setStatus('Listening...', 'live'); };
  }

  async function post(body, query) {
    const r = await fetch(NTFY + cfg.inn + (query ? '?' + query : ''), {method: 'POST', body});
    if (!r.ok) throw new Error('ntfy ' + r.status);
  }

  function newTurn() { turnN++; return session + '-' + turnN; }

  function waitForReply(turn) {
    pendingTurn = turn;
    clearTimeout(turnTimer);
    turnTimer = setTimeout(() => {
      if (pendingTurn !== turn) return;
      pendingTurn = null;
      caption(undefined, laptopSeen ? "She didn't answer that one. Try again?" : "Your laptop isn't answering. Is Capri running and online?");
      setStatus('No answer', 'warn');
      setTimeout(resumeAfterTurn, 1800);
    }, 70000);
  }

  async function sendVoice(blob) {
    const turn = newTurn();
    setState('send');
    try {
      await post(new Blob([blob]), 'filename=voice.' + recExt + '&message=' + encodeURIComponent(MARK + turn));
      setState('think'); waitForReply(turn);
    } catch (e) {
      caption(undefined, "Couldn't send that. Check your signal.");
      setStatus('Send failed', 'warn'); setTimeout(resumeAfterTurn, 1500);
    }
  }

  async function sendText(text) {
    const turn = newTurn();
    stopRecorder(true);
    caption(text, '');
    setState('send');
    try { await post(MARK + turn + '\n' + text); setState('think'); waitForReply(turn); }
    catch (e) { caption(undefined, "Couldn't send that. Check your signal."); setTimeout(resumeAfterTurn, 1500); }
  }

  function onReply(j, audioUrl) {
    clearTimeout(turnTimer);
    pendingTurn = null;
    if (j.heard) caption(j.heard, undefined);
    caption(undefined, j.text || '');
    setFace(j.mood || 'calm');
    if (state === 'idle') return;
    setState('speak');
    if (audioUrl) playHer(audioUrl, j.text);
    else speakFallback(j.text);
  }

  function speakFallback(text) {
    if (!('speechSynthesis' in window) || !text) { setTimeout(resumeAfterTurn, 1200 + 45 * (text || '').length); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1.15; u.volume = Math.min(1, vol);
    u.onend = () => resumeAfterTurn();
    u.onerror = () => resumeAfterTurn();
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  function resumeAfterTurn() {
    if (state === 'idle') return;
    if (muted) setState('muted'); else startListening();
  }

  // ---------------------------------------------------------- the mic: hands-free, it hears when you start and stop talking
  function pickType() {
    const types = [['audio/mp4', 'm4a'], ['audio/mp4;codecs=mp4a.40.2', 'm4a'], ['audio/webm;codecs=opus', 'webm'], ['audio/webm', 'webm']];
    for (const [t, e] of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { recType = t; recExt = e; return; }
    recType = ''; recExt = 'm4a';
  }

  async function ensureMic() {
    if (stream && stream.getAudioTracks().some(t => t.readyState === 'live')) return;
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
  }

  function startRecorder() {
    chunks = [];
    try { rec = recType ? new MediaRecorder(stream, {mimeType: recType}) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    if (!recType && rec.mimeType) recExt = rec.mimeType.includes('webm') ? 'webm' : 'm4a';
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start();
  }

  function stopRecorder(discard) {
    return new Promise(res => {
      if (!rec || rec.state === 'inactive') { rec = null; return res(null); }
      const r = rec; rec = null;
      r.onstop = () => res(discard ? null : new Blob(chunks, {type: r.mimeType || recType || 'audio/mp4'}));
      try { r.stop(); } catch (e) { res(null); }
    });
  }

  async function startListening() {
    if (state === 'idle' || muted) return;
    try { await ensureMic(); }
    catch (e) { setStatus('Mic blocked: allow it in Settings > Safari > Microphone', 'warn'); return; }
    if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    startRecorder();
    speechMs = 0; silenceMs = 0; heardAny = false; listenStart = performance.now(); lastTick = listenStart;
    setState('listen');
  }

  function level() {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let k = 0; k < buf.length; k++) s += buf[k] * buf[k];
    return Math.sqrt(s / buf.length);
  }

  async function vadTick() {
    if (state !== 'listen' || !analyser || !rec) return;
    const now = performance.now(), dt = Math.min(200, now - lastTick); lastTick = now;
    const lv = level();
    if (!heardAny) floor = floor * 0.97 + Math.min(lv, 0.05) * 0.03;
    const thr = Math.max(0.018, floor * 2.6);
    ring.style.transform = 'scale(' + (1 + Math.min(0.18, lv * 2.2)).toFixed(3) + ')';
    if (lv > thr) { speechMs += dt; silenceMs = 0; if (speechMs > 180) heardAny = true; }
    else { silenceMs += dt; if (!heardAny) speechMs = Math.max(0, speechMs - dt); }
    const long = now - listenStart;
    if (heardAny && (silenceMs > 800 || long > 28000)) {
      const blob = await stopRecorder(false);
      if (blob && blob.size > 1500) sendVoice(blob); else startListening();
      return;
    }
    if (!heardAny && long > 20000) { await stopRecorder(true); startListening(); }    // keep clips small while it's quiet
  }

  // ---------------------------------------------------------- call controls
  function unlockAudio() {
    // iOS only lets sound play after a tap: play a blip of silence now so her replies can play later
    const sr = 8000, n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    player.src = URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
    const p = player.play(); if (p && p.catch) p.catch(() => {});
    if ('speechSynthesis' in window) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  }

  async function startCall() {
    unlockAudio();
    pickType();
    session = Math.random().toString(36).slice(2, 8); turnN = 0; laptopSeen = false;
    $('idleCtl').style.display = 'none'; $('callCtl').style.display = 'flex'; $('volbar').classList.add('show');
    caption('', ''); setFace('calm');
    state = 'connecting'; setStatus('Calling...');
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ensureGain();
      await ctx.resume();
      await ensureMic();
    } catch (e) { setStatus('Mic blocked: allow it in Settings > Safari > Microphone', 'warn'); }
    listenForHer();
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    callStart = Date.now();
    clockIv = setInterval(() => {
      const s = Math.floor((Date.now() - callStart) / 1000);
      $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }, 500);
    vadIv = setInterval(vadTick, 50);
    try { await post(MARK + session + '-0 hello'); } catch (e) {}
    setTimeout(() => {
      if (state !== 'connecting') return;
      setStatus("Laptop's not answering yet...", 'warn');
      startListening();
    }, 6000);
  }

  async function endCall() {
    if (state !== 'idle') post(MARK + session + '-0 bye').catch(() => {});
    state = 'idle';
    clearInterval(clockIv); clearInterval(vadIv); clearTimeout(turnTimer); pendingTurn = null;
    await stopRecorder(true);
    stopHer();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; analyser = null; }
    if (es) { es.close(); es = null; }
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
    $('callCtl').style.display = 'none'; $('idleCtl').style.display = 'flex'; $('typebar').classList.remove('show'); $('volbar').classList.remove('show');
    avatar.className = 'avatar'; $('timer').textContent = '';
    setStatus('Call ended'); setFace('calm');
    setTimeout(() => { if (state === 'idle') setStatus('Tap to call'); }, 2500);
  }

  applyVol();
  $('vol').oninput = () => {
    vol = Math.max(0, Math.min(2, Number($('vol').value) / 100));
    applyVol();
    try { localStorage.setItem('capri-vol', String(vol)); } catch (e) {}
  };
  $('callBtn').onclick = startCall;
  $('hangBtn').onclick = endCall;
  $('muteBtn').onclick = async () => {
    muted = !muted;
    $('muteBtn').classList.toggle('on', muted);
    $('muteLbl').textContent = muted ? 'Unmute' : 'Mute';
    if (muted && state === 'listen') { await stopRecorder(true); setState('muted'); }
    else if (!muted && state === 'muted') startListening();
  };
  $('ccBtn').onclick = () => { captions = !captions; $('ccBtn').classList.toggle('on', !captions); $('caption').classList.toggle('hide', !captions); };
  $('kbBtn').onclick = () => { const t = $('typebar'); t.classList.toggle('show'); $('kbBtn').classList.toggle('on', t.classList.contains('show')); if (t.classList.contains('show')) $('typed').focus(); };
  $('typebar').onsubmit = e => {
    e.preventDefault();
    const v = $('typed').value.trim();
    if (!v || state === 'idle') return;
    $('typed').value = '';
    stopHer();
    sendText(v);
  };
  // tap her while she talks to cut in
  avatar.onclick = () => {
    if (state !== 'speak') return;
    stopHer();
    resumeAfterTurn();
  };
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state !== 'idle') {
      try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      if (!es || es.readyState === 2) listenForHer();
    }
  });
})();
</script>
</body>
</html>
